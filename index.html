<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0c0614">
<title>Braai Buddies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#07030a;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #wrap{position:relative;line-height:0;}
  #c{display:block;}
  .ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:80%;max-width:300px;
      background:linear-gradient(#1e0c20,#120614);border:2px solid #d8a24a;outline:3px solid #2a160a;
      border-radius:4px;padding:16px;box-sizing:border-box;display:none;z-index:9;box-shadow:0 10px 40px rgba(0,0,0,.7),0 0 30px rgba(255,120,40,.18);line-height:1.3;}
  .ov h3{margin:0 0 10px;color:#ffd27a;font-size:17px;text-align:center;font-family:Cinzel,Georgia,serif;font-weight:900;letter-spacing:.5px;}
  .ov input{width:100%;box-sizing:border-box;padding:10px;border-radius:3px;border:2px solid #5a3a1a;background:#0e060e;color:#f2e2c0;font-size:15px;
      font-family:inherit;margin-bottom:10px;-webkit-user-select:text;user-select:text;}
  .ov .row{display:flex;gap:8px;}
  .ov button{flex:1;padding:11px 8px;border:2px solid #140812;border-radius:3px;cursor:pointer;font-family:Cinzel,Georgia,serif;font-weight:900;font-size:13px;
      background:linear-gradient(#ff7a2a,#b8281a);color:#fff2d8;}
  .ov button.alt{background:linear-gradient(#3a2a4a,#1a1024);color:#ffd88a;}
  .ov p{margin:0 0 8px;color:#d8c0e0;font-size:11px;text-align:center;line-height:1.4;}
  #cardBox{max-width:340px;}
  #cardBox canvas{width:100%;border-radius:3px;display:block;margin-bottom:10px;box-shadow:0 4px 18px rgba(0,0,0,.5);}
  body.land .ov{width:60%;}
  body.land #cardBox{max-width:560px;width:90%;}
  body.land #cardBox canvas{float:left;width:42%;margin:0 12px 0 0;}
  body.land #cardBox .side{overflow:hidden;}
  .platrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .plat{padding:10px 6px;border:none;border-radius:3px;cursor:pointer;font-family:inherit;font-weight:800;font-size:12px;color:#fff;}
  .plat.wa{background:#25d366;color:#0a2e18;}
  .plat.x{background:#111;color:#fff;border:1px solid #444;}
  .plat.li{background:#0a66c2;}
  .plat.ig{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);}
  .toast{pointer-events:none;position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#1a0c14;color:#ffd27a;border:2px solid #d8a24a;border-radius:3px;
      padding:8px 14px;font-size:12px;font-weight:700;z-index:20;display:none;line-height:1.3;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="640"></canvas>
  <div class="ov" id="nameBox">
    <h3>Save your score</h3>
    <input id="nameIn" maxlength="14" placeholder="Your name" autocomplete="off">
    <div class="row"><button id="nameSave">SAVE</button><button class="alt" id="nameCancel">CANCEL</button></div>
  </div>
  <div class="ov" id="cardBox">
    <h3>Share your score</h3>
    <canvas id="cardCanvas" width="1080" height="1080"></canvas>
    <div class="side">
    <p>Tap a platform below. Your caption and image are copied for you automatically — just paste them into the post before you share it.</p>
    <button id="nativeShare" style="width:100%;margin-bottom:8px;">SHARE (choose an app)</button>
    <div class="platrow">
      <button class="plat wa" id="shareWA">WhatsApp</button><button class="plat x" id="shareX">X / Twitter</button>
      <button class="plat li" id="shareLI">LinkedIn</button><button class="plat ig" id="shareIG">Instagram</button>
    </div>
    <div class="row"><button id="cardDownload" class="alt">DOWNLOAD IMAGE</button><button class="alt" id="cardClose">CLOSE</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>

  afternoon:{bpm:100,swing:0.12,prog:[["F2","maj"],["D3","min"],["A#2","maj"],["C3","maj"]],arp:true,  stabs:true, mel:true, pad:false,kick:[0,4],   clap:[],    shake:1,   bass:"kwela"},
  evening:  {bpm:108,swing:0.14,prog:[["A2","min"],["F2","maj"],["C3","maj"],["G2","maj"]], arp:true,  stabs:false,mel:true, pad:true, kick:[0,4],   clap:[2,6], shake:1,   bass:"kwela"},

  over:     {bpm:76, swing:0,   prog:[["A2","min"],["F2","maj"],["D3","min"],["E2","maj"]], arp:true,  stabs:false,mel:false,pad:true, kick:[],      clap:[],    shake:0,   bass:"soft"}
};
function setSong(name){ if(!A.ctx||A.songName===name) return; A.songName=name; A.song=SONGS[name]; A.step=0; A.nextT=A.ctx.currentTime+0.1; }
function seeded(n){ var x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function schedule(){ if(!A.ctx||!A.song) return;
  var s=A.song, sd=60/s.bpm/2, guard=0;
  if(A.nextT<A.ctx.currentTime-0.3) A.nextT=A.ctx.currentTime+0.05;
  while(A.nextT<A.ctx.currentTime+0.16&&guard++<16){ playStep(s,A.step,A.nextT,sd); A.nextT+=sd*(A.step%2===0?1+s.swing:1-s.swing); A.step++; } }
function playStep(s,step,t,sd){
  var bar=Math.floor(step/8), st=step%8, ch=s.prog[bar%s.prog.length], root=midi(ch[0]), iv=CH[ch[1]];
  /* bass */
  if(s.bass==="kwela"&&[0,3,4,6].indexOf(st)>=0) bassPluck(t,mf(root+(st===3||st===6?7:(st===4?12:0))),sd*1.6,0.32);
  if(s.bass==="drive") bassPluck(t,mf(root+(st%4===2?12:0)),sd*0.9,0.26);
  if(s.bass==="walk"&&st%2===0) bassPluck(t,mf(root+[0,4,7,9][st/2]),sd*1.8,0.3);
  if(s.bass==="soft"&&(st===0||st===5)) bassPluck(t,mf(root+(st===5?7:0)),sd*3,0.26);
  /* marimba arpeggio */
  if(s.arp){ var pat=[0,1,2,1,3,2,1,2], n=root+12+iv[pat[st]%iv.length]+(st===4?12:0); marimba(t,mf(n),0.12+(st%2?0:0.04)); }
  /* off-beat stabs, like a kwela guitar */
  if(s.stabs&&st%2===1){ iv.slice(0,3).forEach(function(x){ marimba(t,mf(root+12+x),0.05,A.music,0.15); }); }
  /* kalimba melody: four-bar phrase from chord tones and passing notes */
  if(s.mel&&[0,2,3,5,6].indexOf(st)>=0){ var r=seeded((bar%4)*11+st+(s.bpm));
    if(r>0.35){ var scale=[0,2,4,7,9,12,14,16], m=root+24+iv[Math.floor(r*3)]+(r>0.85?scale[(st+bar)%scale.length]-iv[0]:0);
      kalimba(t,mf(m),0.09); } }
  /* pad once a bar */
  if(s.pad&&st===0) pad(t,iv.slice(0,3).map(function(x){ return mf(root+12+x); }),sd*8.4,0.022);
  /* drums */
  if(s.kick.indexOf(st)>=0) kick(t,0.45);
  if(s.clap.indexOf(st)>=0) clap(t,0.18);
  if(s.shake) shaker(t,(st%2?0.05:0.09)*s.shake);
}

  if(k==="place"){ thud(t,0.5,900); sizzleBurst(t+0.02,0.45,0.22); }
  else if(k==="flip"){ swoosh(t,0.16,700,2600,0.22); thud(t+0.15,0.35,1200); sizzleBurst(t+0.16,0.35,0.18); }
  else if(k==="plate"){ bell(t,1850,0.12,0.6,A.sfxG); bell(t+0.07,2480,0.1,0.6,A.sfxG); swoosh(t,0.12,1200,3000,0.08); }
  else if(k==="collect"){ ["C5","E5","G5","C6"].forEach(function(m,i){ kalimba(t+i*0.06,nf(m),0.16,A.sfxG,0.4); }); bell(t+0.24,2093,0.05,0.8,A.sfxG); }
  else if(k==="early"){ wood(t,190,0.35); }
  else if(k==="burn"){ var n=noiseSrc(t,1), h=filt("highpass",2800), g=envGain(t,0.05,0.18,0.9); n.connect(h); h.connect(g); route(g,A.sfxG,0.1);
    var o=osc("sawtooth",220,t,0.7); o.frequency.exponentialRampToValueAtTime(70,t+0.6); var lp=filt("lowpass",600), g2=envGain(t,0.01,0.16,0.6); o.connect(lp); lp.connect(g2); route(g2,A.sfxG,0.1); }
  else if(k==="steal"){ swoosh(t,0.25,500,3000,0.2); var o2=osc("sine",1300,t+0.05,0.45); o2.frequency.exponentialRampToValueAtTime(260,t+0.45); var g3=envGain(t+0.05,0.02,0.14,0.4); o2.connect(g3); route(g3,A.sfxG,0.2); }
  else if(k==="spice"){ [0,0.07,0.14,0.21].forEach(function(o){ shaker(t+o,0.22,A.sfxG); }); }
  else if(k==="sauce"){ var n2=noiseSrc(t,0.3), l=filt("lowpass",700,4), g4=envGain(t,0.01,0.3,0.25); l.frequency.setValueAtTime(400,t); l.frequency.exponentialRampToValueAtTime(1400,t+0.15); n2.connect(l); l.connect(g4); route(g4,A.sfxG,0.1);
    var o3=osc("sine",320,t,0.3); o3.frequency.exponentialRampToValueAtTime(120,t+0.25); var g5=envGain(t,0.01,0.14,0.25); o3.connect(g5); route(g5,A.sfxG,0); }
  else if(k==="angry"){ var o4=osc("sawtooth",130,t,0.45), lp2=filt("lowpass",520), g6=envGain(t,0.03,0.14,0.4); var vb=A.ctx.createOscillator(), vg=A.ctx.createGain(); vb.frequency.value=9; vg.gain.value=14; vb.connect(vg); vg.connect(o4.frequency); vb.start(t); vb.stop(t+0.5);
    o4.connect(lp2); lp2.connect(g6); route(g6,A.sfxG,0.1); }
  else if(k==="tap"){ wood(t,900,0.18); }
  else if(k==="ui"){ wood(t,620,0.22); wood(t+0.05,930,0.16); }
  else if(k==="pause"){ wood(t,520,0.25); wood(t+0.08,390,0.2); }
  else if(k==="start"){ ["G4","C5","E5"].forEach(function(m,i){ brass(t+i*0.11,nf(m),0.14,0.1); }); brass(t+0.33,nf("G5"),0.6,0.12); kick(t+0.33,0.4,A.sfxG); }
  else if(k==="over"){ ["A4","F4","D4","A3"].forEach(function(m,i){ brass(t+i*0.28,nf(m),i===3?1.2:0.3,0.11); }); }
  else if(k==="life"){ kick(t,0.7,A.sfxG); thud(t,0.4,300); }
  else if(k==="combo"){ bell(t,523*Math.pow(2,(n||1)/12),0.08,0.5,A.sfxG); }
  else if(k==="warn"){ wood(t,1500,0.12); }
  else if(k==="ko"){ thud(t,0.55,1600); var n3=noiseSrc(t,0.06), b2=filt("bandpass",2600,1), g7=envGain(t,0.001,0.3,0.05); n3.connect(b2); b2.connect(g7); route(g7,A.sfxG,0.3); }
  else if(k==="phase"){ bell(t,196,0.2,2.5,A.sfxG); ["E5","G5","B5","D6"].forEach(function(m,i){ marimba(t+0.2+i*0.08,nf(m),0.14,A.sfxG,0.3); }); }
  else if(k==="praise"){ kalimba(t,nf("E5"),0.1,A.sfxG); kalimba(t+0.08,nf("A5"),0.1,A.sfxG); }
}

/* ================= PEOPLE: vector character generator =================
   Every human in the game (buddies, customers, human thieves) is built
   from parts around a simple skeleton, feet at (0,0), about 92 units tall.
   Poses move the hands and feet; arms and legs bend with two-bone IK.
     views : front | back
     poses : idle walk celebrate panic burnt reach slump angry fan tong wave
     moods : smile neutral happy angry sad hot sneaky greedy hurt dizzy scared
   Each (person, view, pose, frame, mood, light, scale) is baked once.    */
var PERSON_FRAMES={idle:2,walk:4,celebrate:2,panic:2,burnt:2,reach:2,slump:2,angry:2,fan:2,tong:1,wave:2};
var LIGHTS={F:[0.12,0.99],T:[0.74,0.67],B:[0,-1]};

function ikJoint(sx,sy,hx,hy,len,side){
  var dx=hx-sx, dy=hy-sy, d=Math.hypot(dx,dy)||1;
  if(d>=2*len-0.05) return [(sx+hx)/2,(sy+hy)/2];
  var h=Math.sqrt(len*len-(d/2)*(d/2)), mx=(sx+hx)/2, my=(sy+hy)/2, nx=-dy/d, ny=dx/d;
  var s=(nx*side>0)?1:-1; return [mx+nx*h*s,my+ny*h*s]; }

/* where the hands and feet go for each pose and frame */
function poseOf(view,pose,f,spec){
  var o={dy:0,dx:0,hl:[-18,-30],hr:[18,-30],fl:[-6.5,0],fr:[6.5,0],liftL:0,liftR:0,headDy:0,tilt:0,tongUp:false};
  if(pose==="idle"){ o.dy=f?1:0; }
  else if(pose==="walk"){ var sw=[3,0,-3,0][f], lf=[0,2.5,0,0][f], rf=[0,0,0,2.5][f];
    o.hl=[-18+sw*0.4,-31-sw]; o.hr=[18+sw*0.4,-31+sw]; o.fl=[-6.5+sw*0.5,-lf]; o.fr=[6.5-sw*0.5,-rf]; o.dy=(f%2)?-1:0; }
  else if(pose==="celebrate"){ o.hl=[-21,f?-88:-84]; o.hr=[21,f?-84:-88]; o.dy=f?-3:0; o.fl=[-7,f?-2:0]; o.fr=[7,f?-2:0]; o.tongUp=true; }
  else if(pose==="panic"){ o.hl=f?[-26,-66]:[-27,-58]; o.hr=f?[27,-58]:[26,-66]; o.dx=f?1:-1; }
  else if(pose==="burnt"){ o.hl=[-11,f?-82:-80]; o.hr=[11,f?-80:-82]; o.dy=1; }
  else if(pose==="reach"){ o.hl=f?[-26,-44]:[-25,-48]; o.hr=f?[26,-50]:[27,-46]; o.dy=2; }
  else if(pose==="slump"){ o.hl=[-15,-28]; o.hr=[15,-28]; o.dy=f?3:2; o.headDy=2; }
  else if(pose==="angry"){ o.hl=[-9,-36]; o.hr=f?[22,-80]:[9,-36]; o.elbowOut=true; }
  else if(pose==="fan"){ o.hl=[-9,-36]; o.hr=f?[13,-74]:[17,-70]; o.elbowOut=true; }
  else if(pose==="tong"){ o.hr=[24,-84]; o.tongUp=true; }
  else if(pose==="wave"){ o.hl=[-25,-46]; o.hr=f?[30,-72]:[25,-82]; }
  return o; }

/* default face for a pose when no mood is given (the buddies) */
function faceFor(pose,mood){ if(mood) return mood;
  return pose==="celebrate"?"happy":pose==="panic"?"scared":pose==="burnt"?"hurt":"smile"; }

/* ---------- faces ---------- */
function drawFace(c,mood,cx,cy,spec,f){
  c.lineCap="round"; c.lineJoin="round";
  var ey=cy-1.5, eyeW=3.2;
  c.strokeStyle=INK;
  /* brows */
  c.lineWidth=1.9; c.beginPath();
  if(mood==="angry"||mood==="sneaky"||mood==="greedy"){ c.moveTo(cx-7.4,ey-5.4); c.lineTo(cx-1.5,ey-2.3); c.moveTo(cx+7.4,ey-5.4); c.lineTo(cx+1.5,ey-2.3); }
  else if(mood==="sad"||mood==="hurt"||mood==="hot"){ c.moveTo(cx-7,ey-2.6); c.lineTo(cx-2,ey-5); c.moveTo(cx+7,ey-2.6); c.lineTo(cx+2,ey-5); }
  else if(mood==="scared"){ c.moveTo(cx-7,ey-6.6); c.quadraticCurveTo(cx-4.5,ey-8.4,cx-2,ey-6.8); c.moveTo(cx+7,ey-6.6); c.quadraticCurveTo(cx+4.5,ey-8.4,cx+2,ey-6.8); }
  else if(mood!=="dizzy"){ c.moveTo(cx-7,ey-4.6); c.quadraticCurveTo(cx-4.5,ey-6.2,cx-2,ey-4.8); c.moveTo(cx+7,ey-4.6); c.quadraticCurveTo(cx+4.5,ey-6.2,cx+2,ey-4.8); }
  c.stroke();
  /* eyes */
  [-1,1].forEach(function(s){ var ex=cx+s*4.4;
    if(mood==="happy"||mood==="smile"&&f===1&&false){ }
    if(mood==="happy"){ c.beginPath(); c.moveTo(ex-eyeW,ey+0.8); c.quadraticCurveTo(ex,ey-2.8,ex+eyeW,ey+0.8); c.lineWidth=1.8; c.stroke(); return; }
    if(mood==="hot"||mood==="hurt"){ c.beginPath(); c.moveTo(ex-s*2.6,ey-2); c.lineTo(ex+s*1.4,ey); c.lineTo(ex-s*2.6,ey+2); c.lineWidth=1.6; c.stroke(); return; }
    if(mood==="dizzy"){ c.beginPath(); for(var a=0;a<10;a+=0.4){ var r=0.3+a*0.28; c.lineTo(ex+Math.cos(a+(f||0)*2)*r,ey+Math.sin(a+(f||0)*2)*r); } c.lineWidth=1; c.stroke(); return; }
    var big=mood==="scared"?1.35:1;
    c.beginPath(); c.moveTo(ex-eyeW*big,ey); c.quadraticCurveTo(ex,ey-2.6*big,ex+eyeW*big,ey); c.quadraticCurveTo(ex,ey+2.1*big,ex-eyeW*big,ey); c.closePath();
    c.fillStyle="#f6eadc"; c.fill(); c.lineWidth=1.1; c.stroke();
    var px=(mood==="sneaky"||mood==="greedy")?ex+1.5:ex, pr=mood==="scared"?0.8:1.25;
    c.fillStyle=INK; c.beginPath(); c.arc(px,ey+0.1,pr,0,7); c.fill();
    if(mood!=="scared"){ c.fillStyle="#fff"; c.fillRect(px-0.7,ey-0.9,0.7,0.7); } });
  /* nose */

/* ---------- the body ---------- */
function drawPerson(c,spec,view,pose,f,mood,L){
  var o=poseOf(view,pose,f,spec), dy=o.dy, dx=o.dx||0, front=view==="front";

  /* arms behind the body in the back view */

    var e=ikJoint(sx,shY+2,hx,hyy,14,o.elbowOut?side:side);
    if(hyy<shY-4) e=ikJoint(sx,shY+2,hx,hyy,14,side);
    var sleeve=spec.hivis||spec.longSleeve?shirt:shirt;
    lit(c,limb(sx,shY+2,e[0],e[1],4.8,4),sleeve,L,{k:3});
    lit(c,limb(e[0],e[1],hx,hyy,4,3.4),(spec.hivis||spec.longSleeve)?shirt:sk,L,{k:3});
    lit(c,ell(hx,hyy,3.8,3.8),sk,L,{k:2,ink:1.6});
    if(spec.hivis){ c.save(); c.clip(limb(e[0],e[1],hx,hyy,4,3.4)); c.strokeStyle="#e8eef6"; c.lineWidth=2.2; c.beginPath();
      var mx=(e[0]+hx)/2, my=(e[1]+hyy)/2; c.moveTo(mx-6,my+3); c.lineTo(mx+6,my-3); c.stroke(); c.restore(); }
    /* tongs in the right hand */
    if(side>0&&spec.tongs&&(pose==="idle"||pose==="walk"||pose==="tong"||pose==="celebrate")){
      var up=o.tongUp, ang=up?-1.9:1.35, l=20;
      var tx=hx+Math.cos(ang)*l, ty=hyy+Math.sin(ang)*l;
      c.lineCap="round"; c.strokeStyle=INK; c.lineWidth=3.6; c.beginPath(); c.moveTo(hx,hyy); c.lineTo(tx-2,ty); c.moveTo(hx,hyy); c.lineTo(tx+2.4,ty+1); c.stroke();
      c.strokeStyle="#cfd6e6"; c.lineWidth=1.5; c.stroke();
      c.strokeStyle="#fff2c8"; c.lineWidth=0.6; c.beginPath(); c.moveTo(hx,hyy); c.lineTo(tx-2,ty); c.stroke(); } }
  if(!front) arms.forEach(function(a){ if(a[1][1]>shY) drawArm(a); });

  if(spec.hivis){ c.fillStyle="#e8eef6"; c.fillRect(-20,hipY-6,40,3.2); c.fillRect(-20,hipY+1,40,3.2);

  if(spec.coatPatch){ c.fillStyle=spec.coatPatch; c.fillRect(-11,hipY-9,6,6); c.fillRect(6,shY+5,5,7);
    c.strokeStyle=INK; c.lineWidth=0.8; c.strokeRect(-11,hipY-9,6,6); c.strokeRect(6,shY+5,5,7); }

  /* apron */
  if(spec.apron){
    if(front){ var ap=Pth(function(p){ p.moveTo(-8,shY+5); p.lineTo(8,shY+5); p.lineTo(9,hipY); p.lineTo(13,hipY+1); p.lineTo(12,-12); p.quadraticCurveTo(0,-9,-12,-12); p.lineTo(-13,hipY+1); p.lineTo(-9,hipY); p.closePath(); });
      lit(c,ap,spec.apron,L,{k:5});
      if(spec.apronDots){ c.save(); c.clip(ap); c.fillStyle=spec.apronDots; for(var i=0;i<12;i++){ c.beginPath(); c.arc(-9+(i%4)*6,shY+10+((i/4)|0)*9,1.2,0,7); c.fill(); } c.restore(); }
      c.strokeStyle=shadeOf(spec.apron); c.lineWidth=1; c.strokeRect(-5,hipY+4,10,6);

  lit(c,ell(-10.4,hy+1,2.2,3.2),sk,L,{k:1,ink:1.2}); lit(c,ell(10.4,hy+1,2.2,3.2),sk,L,{k:1,ink:1.2});

function drop(c,x,y,s){ s=s||1; c.fillStyle="#9ad8ff"; c.beginPath(); c.moveTo(x,y-3*s); c.quadraticCurveTo(x+2.6*s,y+1*s,x,y+2*s); c.quadraticCurveTo(x-2.6*s,y+1*s,x,y-3*s); c.fill();
  c.strokeStyle=INK; c.lineWidth=0.9; c.stroke(); c.fillStyle="#fff"; c.fillRect(x-0.8*s,y-1*s,0.8,0.8); }

  c.strokeStyle=INK; c.lineWidth=1; c.stroke(); }
function personFx(c,md,pose,f,hy){

  if(md==="hot"){ drop(c,-14,hy+2); c.strokeStyle="rgba(255,255,255,0.85)"; c.lineWidth=1.3; c.beginPath();

  if(md==="angry"){ c.strokeStyle="#ff2a3a"; c.lineWidth=1.6; c.beginPath(); c.moveTo(5,hy-10); c.lineTo(8.5,hy-7); c.moveTo(8.5,hy-10); c.lineTo(5,hy-7); c.stroke();

      g.fillStyle="rgba(200,230,120,0.5)"; for(var i=0;i<14;i++){ g.beginPath(); g.arc(-32+i*5,-4-((i*7)%8),1.2,0,7); g.fill(); } },1); } return b; }

function drawFlag(t){ var f=LY.flag, tex=flagTex(), pw=tex.c.width/36;

  ctx.beginPath(); ctx.moveTo(f.x+1,f.y+24); for(var i=0;i<=36;i+=4) ctx.lineTo(f.x+1+i,f.y+24+Math.sin(t*3.4-i*0.25)*(1.2+i*0.06)); ctx.stroke(); }

    ctx.fillStyle=["#ffd27a","#ff9a6a","#fff0b0"][i%3]; ctx.fillRect(x-1,y-1,2.2,3); } }
function drawWashing(t){ var wl=LY.washing, items=[["#d82a2a",10,13,1],["#3a6ad0",12,16,0],["#f2c94c",9,11,1],["#ffffff",12,14,0],["#4f9e63",10,12,1]];
  for(var i=0;i<items.length;i++){ var it=items[i], ix=wl.x1+8+i*((wl.x2-wl.x1-16)/items.length);
    var iy=wl.y+2+Math.sin((ix-wl.x1)/(wl.x2-wl.x1)*Math.PI)*4, sw=Math.sin(t*2.2+i)*1.6;

    var p=it[3]?Pth(function(pp){ pp.moveTo(0,0); pp.lineTo(it[1],0); pp.lineTo(it[1],it[2]+5); pp.lineTo(it[1]-3.6,it[2]+5); pp.lineTo(it[1]/2,it[2]*0.5); pp.lineTo(3.6,it[2]+5); pp.lineTo(0,it[2]+5); pp.closePath(); })

function drawHadeda(dt,ph){ var h=SCN.hadeda; if(ph.key==="night") return;

function drawSleepyDog(t){ var d=LY.dog, br=Math.sin(t*2)>0?1:0;
  var key="DOG|"+br, b=PERM[key];
  if(!b){ b=PERM[key]=bake(50,26,25,20,function(g){ var L=[0.4,-0.9];

      lit(g,ell(13,-5,7,5.5),"#f4f0e8",L,{k:2,ink:1.8}); lit(g,ell(15,-9,3.4,2.4),"#8a5a2a",L,{k:1,ink:1.2,cool:false});
      g.strokeStyle=INK; g.lineWidth=1.1; g.beginPath(); g.moveTo(12,-5); g.quadraticCurveTo(14,-4,16,-5); g.stroke();

function drawBirds(dt,loc){ var gull=loc&&(loc.id==="cpt"||loc.id==="kzn"); ctx.strokeStyle=gull?"#f4f0f8":INK; ctx.lineWidth=gull?1.6:1.3;
  SCN.birds.forEach(function(b){ b.x+=b.v*dt; b.p+=dt*9; if(b.x>W+20) b.x=-20; var f=Math.sin(b.p)*3;
    ctx.beginPath(); ctx.moveTo(b.x-5,b.y-f); ctx.quadraticCurveTo(b.x-2,b.y-1,b.x,b.y); ctx.quadraticCurveTo(b.x+2,b.y-1,b.x+5,b.y-f); ctx.stroke(); }); }

/* the background for the current time of day, cross-fading on a change */
function drawBackdrop(ph,dt,t){
  var loc=curLoc(), bg=sceneLayer(ph,loc), meta=bg.meta||{};
  if(SCN.prevKey&&SCN.prevKey!==ph.key){ SCN.prev=sceneLayer(PHASES.filter(function(p){return p.key===SCN.prevKey;})[0],loc); SCN.fade=1; }
  SCN.prevKey=ph.key;
  ctx.drawImage(bg.c,0,0,W,H);
  if(SCN.fade>0&&SCN.prev){ SCN.fade=Math.max(0,SCN.fade-dt/2.2); ctx.globalAlpha=SCN.fade; ctx.drawImage(SCN.prev.c,0,0,W,H); ctx.globalAlpha=1; }
  /* glints on the sea (Cape Town, Durban) */
  if(meta.sea) drawSeaGlints(meta.sea,ph,t);
  /* clouds */
  if(ph.key!=="night") SCN.clouds.forEach(function(cl,i){ cl.x+=cl.v*dt; if(cl.x>W+60) cl.x=-60; blit(cloudSprite(ph,i%2?0.8:1),cl.x,cl.y,cl.s); });
  else SCN.clouds.forEach(function(cl,i){ cl.x+=cl.v*dt*0.5; if(cl.x>W+60) cl.x=-60; ctx.globalAlpha=0.5; blit(cloudSprite(ph,1),cl.x,cl.y,cl.s); ctx.globalAlpha=1; });
  if(ph.dark<0.6) drawBirds(dt,loc);
  if(loc.id==="jhb"||loc.id==="kzn") drawHadeda(dt,ph);
  /* beacons on towers, the lighthouse sweep */
  if(meta.lighthouse) drawLighthouse(meta.lighthouse,ph,t);
  if(ph.dark>0.5) (meta.beacons||[]).forEach(function(bc,i){ if(Math.sin(t*(2.6+i*0.4))>0){ ctx.fillStyle="#ff4a3a"; ctx.beginPath(); ctx.arc(bc[0],bc[1],2.2,0,7); ctx.fill();
    ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=0.6; ctx.drawImage(GLOW_SPR,bc[0]-10,bc[1]-10,20,20); ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over"; } });
  if(loc.id==="jhb"||loc.id==="karoo") drawWashing(t);
  drawFlag(t);
  var ac=LY.acacia, tr=TREES[treeOf(loc)]; blit(tr.crown(),ac.x+Math.sin(t*0.9)*tr.sway,ac.y+tr.dy*ac.s);
  drawBunting(t,ph);
}

/* ---------- the fire's light and the dark around it ---------- */
function lightLayer(){ var key="LIGHT|"+(LAND?"L":"P"); if(LAYERS[key]) return LAYERS[key];
  var c=document.createElement("canvas"); c.width=Math.ceil(W/2); c.height=Math.ceil(H/2); var x=c.getContext("2d"); x.scale(0.5,0.5);
  var fx=fireX(), fy=fireY(), R=LAND?300:250;
  var g=x.createRadialGradient(fx,fy,10,fx,fy,R); g.addColorStop(0,"rgba(255,140,50,0.5)"); g.addColorStop(0.35,"rgba(255,90,40,0.18)"); g.addColorStop(1,"rgba(255,60,30,0)");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  g=x.createRadialGradient(fx,fy,4,fx,fy,LAND?160:140); g.addColorStop(0,"rgba(255,220,140,0.35)"); g.addColorStop(1,"rgba(255,160,60,0)");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  return (LAYERS[key]={c:c}); }
function darkLayer(){ var key="DARK|"+(LAND?"L":"P"); if(LAYERS[key]) return LAYERS[key];
  var c=document.createElement("canvas"); c.width=Math.ceil(W/2); c.height=Math.ceil(H/2); var x=c.getContext("2d"); x.scale(0.5,0.5);
  var fx=fireX(), fy=fireY()-40, R=Math.max(W,H)*0.68;
  var g=x.createRadialGradient(fx,fy,LAND?150:120,fx,fy,R); g.addColorStop(0,"rgba(8,2,14,0)"); g.addColorStop(1,"rgba(8,2,14,1)");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  return (LAYERS[key]={c:c}); }
function drawLighting(ph,t){
  ctx.fillStyle=ph.tint; ctx.fillRect(0,0,W,H);
  var fl=0.86+0.09*Math.sin(t*5.3)+0.05*Math.sin(t*11.7);
  ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=Math.min(1,ph.glow*fl*(QUALITY.high?1:0.8));
  ctx.drawImage(lightLayer().c,0,0,W,H); ctx.restore();
  ctx.globalAlpha=ph.dark; ctx.drawImage(darkLayer().c,0,0,W,H); ctx.globalAlpha=1; }

/* ================= LOCATIONS: Cape Town, the Karoo, KwaZulu-Natal =================
   PLACEHOLDER ART, drawn in the same painted-comic style as Johannesburg.
   Each location swaps these pieces of the backdrop:
     SKYLINES[id]  what's beyond the fence (baked per time of day)
     BACKPROP[id]  the thing peeking over the fence (JHB: the bakkie)
     FENCE[id]     the fence itself
     GROUND[id]    the yard floor
     PROP[id]      the little prop by the fence (JHB: the gnome)
     TREES[...]    the tree on the right (trunk is baked, the crown sways live)
   The time-of-day colours (ph.*) come from PHASES in 03_data.js, so every
   location still goes morning -> night.                                    */

/* ---------------------------------------------------------------- skylines */
var SKYLINES={};

/* CAPE TOWN: Table Mountain with its tablecloth, Devil's Peak, Lion's Head,
   the city at its feet, the stadium, harbour cranes, the sea, a lighthouse */
SKYLINES.cpt=function(c,ph){
  var hz=LY.horizon, hs=hsc(), L=[ph.sun.x<0.5?-0.6:0.6,0.8], seaTop=hz-26*hs;
  var far=mixHex(ph.city,"#3a5a8a",0.35), farHi=ph.cityRim;
  /* the mountain massif */
  var mt=Pth(function(p){ p.moveTo(-10,seaTop+4);
    p.lineTo(W*0.02,hz-96*hs); p.lineTo(W*0.08,hz-126*hs); p.lineTo(W*0.12,hz-112*hs);            /* Devil's Peak */
    p.lineTo(W*0.17,hz-118*hs); p.lineTo(W*0.62,hz-120*hs); p.lineTo(W*0.66,hz-116*hs);              /* the flat table */
    p.lineTo(W*0.72,hz-78*hs); p.lineTo(W*0.78,hz-70*hs);
    p.quadraticCurveTo(W*0.83,hz-104*hs,W*0.87,hz-102*hs); p.quadraticCurveTo(W*0.9,hz-90*hs,W*0.92,hz-62*hs);   /* Lion's Head */
    p.lineTo(W+10,hz-40*hs); p.lineTo(W+10,seaTop+4); p.closePath(); });
  lit(c,mt,far,L,{k:9,rim:farHi,ink:1.8,cool:false});
  /* cliff striations on the table face */
  c.save(); c.clip(mt); c.strokeStyle=mixHex(far,"#000000",0.25); c.lineWidth=1.2;
  for(var i=0;i<26;i++){ var x=W*0.18+i*W*0.017; c.beginPath(); c.moveTo(x,hz-116*hs); c.lineTo(x+((i*7)%5)-2,hz-(70+((i*13)%20))*hs); c.stroke(); }
  c.fillStyle=mixHex(far,"#2a4a2a",0.35); c.fillRect(0,hz-60*hs,W,60*hs); c.restore();
  /* the tablecloth cloud (daytime only) */
  if(ph.dark<0.5){ var tc=Pth(function(p){ p.moveTo(W*0.15,hz-118*hs);
      for(var i=0;i<=12;i++){ var x=W*0.15+i*W*0.04; p.quadraticCurveTo(x-W*0.02,hz-(128+(i%3)*3)*hs,x,hz-121*hs); }
      p.lineTo(W*0.65,hz-108*hs); for(var i=12;i>=0;i--){ var x=W*0.15+i*W*0.04; p.quadraticCurveTo(x+W*0.02,hz-(104-(i%4)*4)*hs,x,hz-(110-(i%2)*6)*hs); } p.closePath(); });
    lit(c,tc,mixHex("#f4f0f8",ph.cloud,0.25),[0.4,0.9],{k:4,rim:"#ffffff",ink:1.4,cool:false}); }
  /* the city at the foot of the mountain */
  for(var i=0;i<14;i++){ var x=W*0.26+i*W*0.028, h=(16+((i*29)%28))*hs, w=W*0.024;
    var col=mixHex(ph.city,["#5a2a6a","#2a3a6a","#6a3a3a","#3a4a5a"][i%4],0.3);
    lit(c,rrect(x,seaTop-h,w,h+6,1),col,L,{k:4,rim:ph.cityRim,ink:1.3,cool:false});
    for(var r=0;r<Math.floor(h/7);r++){ if(((r*5+i*3)%10)/10<ph.windows){ c.fillStyle="#ffcf6a"; c.fillRect(x+2,seaTop-h+3+r*7,w-4,2.4); } } }
  /* Bo-Kaap: bright little houses on the slope */
  var bo=["#ff6a9a","#ffd23a","#5ad0a8","#6a8aff","#ff8a3a","#c86aff"];
  for(var i=0;i<9;i++){ var x=W*0.04+i*W*0.024, y=seaTop-6-((i*3)%5)*hs;
    lit(c,rrect(x,y-9*hs,W*0.022,9*hs+4,1),mixHex(bo[i%6],ph.city,0.35),L,{k:2,rim:"#ffffff",ink:1.1,cool:false}); }
  /* the stadium */
  lit(c,ell(W*0.73,seaTop-5*hs,W*0.06,10*hs),mixHex("#f2eee8",ph.city,0.4),L,{k:4,rim:"#ffffff",ink:1.5,cool:false});
  c.strokeStyle=mixHex("#c8c0d0",ph.city,0.4); c.lineWidth=1; for(var i=0;i<7;i++){ c.beginPath(); c.moveTo(W*0.73-W*0.05+i*W*0.016,seaTop-13*hs); c.lineTo(W*0.73-W*0.05+i*W*0.016,seaTop+2); c.stroke(); }
  /* harbour cranes */
  c.strokeStyle=mixHex(ph.city,"#d84a3a",0.45); c.lineWidth=1.6;
  [W*0.62,W*0.66].forEach(function(x){ c.beginPath(); c.moveTo(x,seaTop+2); c.lineTo(x,seaTop-30*hs); c.lineTo(x-14*hs,seaTop-24*hs); c.moveTo(x,seaTop-30*hs); c.lineTo(x+8*hs,seaTop-26*hs); c.stroke(); });
  /* the sea */
  var sg=c.createLinearGradient(0,seaTop,0,hz+10); sg.addColorStop(0,mixHex(ph.sky[2],"#0a2a5a",0.45)); sg.addColorStop(1,mixHex(ph.sky[1],"#061a3a",0.6));
  c.fillStyle=sg; c.fillRect(0,seaTop,W,hz+10-seaTop);
  c.strokeStyle=INK; c.lineWidth=1.6; c.beginPath(); c.moveTo(0,seaTop); c.lineTo(W,seaTop); c.stroke();
  c.strokeStyle="rgba(255,255,255,0.18)"; c.lineWidth=1; for(var r=0;r<5;r++){ c.beginPath(); for(var x=0;x<W;x+=8) c.lineTo(x,seaTop+5+r*5+Math.sin(x*0.08+r)*1.2); c.stroke(); }
  /* the lighthouse, red and white */
  var lx=W*0.94, ly=seaTop+2;
  lit(c,poly([[lx-4*hs,ly],[lx+4*hs,ly],[lx+2.6*hs,ly-30*hs],[lx-2.6*hs,ly-30*hs]]),"#f4f0e8",L,{k:2,ink:1.3,cool:false});
  c.fillStyle="#d8283a"; for(var i=0;i<3;i++) c.fillRect(lx-3.6*hs+i*0.4*hs,ly-8*hs-i*9*hs,7.2*hs-i*0.8*hs,4*hs);
  lit(c,rrect(lx-3.6*hs,ly-36*hs,7.2*hs,6*hs,1),"#3a3a48",L,{k:1,ink:1.2,cool:false});
  SCN.lighthouse=[lx,ly-33*hs]; SCN.sea=[seaTop,hz,0,W];
};

/* THE KAROO: flat-topped koppies, a long empty plain, a windpump, telephone
   poles, a little dorp church and sheep dotted on the veld               */
SKYLINES.karoo=function(c,ph){
  var hz=LY.horizon, hs=hsc(), L=[ph.sun.x<0.5?-0.6:0.6,0.8];
  /* far mountains, low and blue */
  var far=Pth(function(pp){ pp.moveTo(-10,hz+8); for(var x=-10;x<=W+10;x+=14){ pp.lineTo(x,hz-20*hs-14*hs*(0.5+0.5*Math.sin(x*0.011+0.8))); } pp.lineTo(W+10,hz+8); pp.closePath(); });
  lit(c,far,mixHex(ph.city,"#6a6aa0",0.35),L,{k:6,rim:ph.cityRim,ink:1.4,cool:false});
  /* the flat-topped koppies (mesas) with banded cliffs */
  [[W*0.2,64,W*0.16,W*0.07],[W*0.66,48,W*0.13,W*0.05],[W*0.9,36,W*0.09,W*0.04]].forEach(function(m,i){ var x=m[0], h=m[1]*hs, w=m[2], top=m[3];
    var p=Pth(function(pp){ pp.moveTo(x-w,hz+6); pp.lineTo(x-top-w*0.18,hz-h*0.62); pp.lineTo(x-top,hz-h); pp.lineTo(x+top,hz-h); pp.lineTo(x+top+w*0.18,hz-h*0.62); pp.lineTo(x+w,hz+6); pp.closePath(); });
    var kc=mixHex(ph.city,"#9a5a3a",0.38); lit(c,p,kc,L,{k:7,rim:ph.cityRim,ink:1.8,cool:false});
    c.save(); c.clip(p); c.strokeStyle=mixHex(kc,"#000000",0.22); c.lineWidth=1.2;
    for(var b2=1;b2<4;b2++){ var y=hz-h+b2*h*0.16; c.beginPath(); c.moveTo(x-w,y); c.lineTo(x+w,y+1); c.stroke(); } c.restore(); });

var WIPE={t:1,last:null};
function drawWipe(dt){
  if(state!==WIPE.last){ if(WIPE.last!==null&&!(WIPE.last==="play"&&state==="paused")&&!(WIPE.last==="paused"&&state==="play")) WIPE.t=0; WIPE.last=state; }
  if(WIPE.t>=1) return; WIPE.t=Math.min(1,WIPE.t+dt/0.42);
  var e=easeIO(WIPE.t), x=-W*0.4+e*(W*1.8), slope=H*0.35;
  ctx.fillStyle="#0a0410";
  ctx.beginPath(); ctx.moveTo(x,0);
  for(var y=0;y<=H;y+=H/16) ctx.lineTo(x-slope*(y/H)+Math.sin(y*0.15+WIPE.t*9)*10,y);
  ctx.lineTo(W*3,H); ctx.lineTo(W*3,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#d8a24a"; ctx.lineWidth=2; ctx.stroke(); }

/* ================= GAME: state machine, rules, tutorial =================
   The game is always in exactly one state (ST below). Each state has its
   own draw, tap and music entry in SCREENS (10b_flow.js); change state
   only through setState() so enter() hooks and the ink wipe run.

   Flow:  MENU -> DEVICE -> MODE_SELECT (the hub: how to, enemies, scores)
            Endless:   -> LOCATION_SELECT -> CHAR_SELECT -> PLAYING -> LOSE
            Tutorial:  -> CHAR_SELECT -> PLAYING -> TUT_END
            Adventure: -> LEVEL_SELECT -> CHAR_SELECT -> PLAYING / BOSS -> WIN / LOSE (Phase 2+)
          PLAYING <-> PAUSED                                             */
var ST={
  CARD:"card",               /* someone opened a shared score link */
  MENU:"title",              /* the title screen */
  DEVICE:"device",           /* phone or PC */
  CHAR_SELECT:"select",      /* choose your buddy, right before playing */
  HOWTO:"howto", ENEMIES:"enemies", SCORES:"scores",
  MODE_SELECT:"mode",        /* Adventure, Endless or Tutorial */
  LOCATION_SELECT:"location",/* where to braai in Endless */
  LEVEL_SELECT:"levels",     /* Adventure map (Phase 2) */
  PLAYING:"play",
  BOSS:"boss",               /* boss fight (Phase 4) */
  PAUSED:"paused",
  TUT_END:"tutend",
  WIN:"win",                 /* level cleared (Phase 2) */
  LOSE:"over"                /* out of hearts */
};
var state=ST.MENU, prevState=null, sel=0, G=null, gt=0, card=null;
function setState(s){ if(s===state) return; prevState=state; state=s;
  var sc=typeof SCREENS!=="undefined"&&SCREENS[s]; if(sc&&sc.enter) sc.enter(prevState); }
(function(){ try{ var q=new URLSearchParams(location.search);
  if(q.get("s")!==null){ card={s:parseInt(q.get("s"),10)||0,n:(q.get("n")||"Braai Buddy").substring(0,16),l:LOCS[q.get("l")]?q.get("l"):null}; state=ST.CARD; } }catch(e){} })();

/* ---------- rules ---------- */
function phaseIdx(){ return Math.min(3,Math.floor(G.t/PHASE_LEN)); }
function phaseNow(){ return PHASES[phaseIdx()]; }
function diff(){ return (1+Math.min(CONFIG.DAY.rampMax,G.t/CONFIG.DAY.rampOver))*PH_DIFF[phaseIdx()]; }
function maxThieves(){ return PH_THIEVES[phaseIdx()]; }
function maxQueue(){ return PH_QUEUE[phaseIdx()]; }
function pop(x,y,s,c,size,glow){ G.pops.push({x:x,y:y,t:0,s:s,c:c||"#ffd27a",size:size||13,glow:glow}); }
function burst(x,y,word,fill,tc){ G.bursts.push({x:x,y:y,w:word,fill:fill,tc:tc||"#fff6e0",t:0,rot:(Math.random()-0.5)*0.4,pts:9+((Math.random()*3)|0)}); }
function bubble(x,y,text,col,dur){ G.bubbles.push({x:x,y:y,s:text,c:col||"#5a1410",t:0,d:dur||1.8}); }
function puff(x,y,n,col){ FX.dust.emit(x,y,n||6,{spread:2.4,speed:34,jitter:6,col:col||null}); }
function setPose(p,t){ G.pose=p; G.poseT=t; }
function playerPose(moving){
  if(G.poseT>0) return G.pose;
  for(var i=0;i<4;i++){ var m=G.slots[i]; if(m&&!m.dead&&m.p>windowFor(m)[1]) return "panic"; }
  if(moving) return "walk"; if(G.swing>0) return "tong"; return "idle"; }
function poseFrame(pose){ if(pose==="walk") return ((G.walk/1.57)|0)%4; if(pose==="idle") return ((gt*BUDDY_MOVES[G.ch.id].idle)|0)%2; return ((gt*6)|0)%2; }
function loseLife(x,y,msg){ custReact("sad",1.3); G.lives--; setPose(msg==="BURNT!"?"burnt":"panic",msg==="BURNT!"?1.1:0.8); G.combo=1; G.flash=0.3; G.shake=8;
  burst(x,y,msg,"#d8282a"); sfx("life");
  if(G.lives<=0){ setState(ST.LOSE); G.overT=0; sfx("over"); setSong("over"); } }
function windowFor(m){ var w=RU.windowHalf*G.ch.win*(m.sp.baste?RU.basteWiden:1)*(m.sp.peri?RU.periNarrow:1); return [RU.windowCentre-w,Math.min(RU.windowMaxEnd,RU.windowCentre+w)]; }
function burnAt(){ return RU.burnAt+(perk().burnExtra||0); }
function meatMult(m){ var mu=1; for(var i=0;i<BOOST.length;i++) mu+=BOOST[i].bonus*(+m.sp[BOOST[i].id]||0); return mu; }
function cookDur(def,sp){ return (def.dur/diff()/(perk().cookSpeed||1))*((sp&&sp.herb)?RU.herbSlow:1)*(G&&G.tut?RU.tutorialSlow:1); }
/* stage float for the meat colour: 0 raw .. 2 done .. 4 burnt */
function cookStage(m){ var w=windowFor(m);
  if(m.dead) return 4; if(m.p<0.4) return m.p/0.4; if(m.p<w[0]) return 1+(m.p-0.4)/(w[0]-0.4); if(m.p<=w[1]) return 2;
  if(m.p<1.06) return 2+(m.p-w[1])/(1.06-w[1]); return Math.min(4,3+(m.p-1.06)/(burnAt()-1.06)); }

/* ---------- flip styles (looks only) ---------- */
function flipShape(m){ var T=m.flipT||0.44, f=clamp01(1-m.flip/T), st=m.flipStyle||"classic";
  if(st==="gentle") return {lift:-Math.sin(f*Math.PI)*11,sq:Math.max(0.22,Math.abs(Math.cos(f*Math.PI))),dx:0,rot:0};
  if(st==="toss") return {lift:-Math.sin(f*Math.PI)*50,sq:Math.max(0.14,Math.abs(Math.cos(f*2*Math.PI))),dx:Math.sin(f*2*Math.PI)*5,rot:f*Math.PI*2};
  if(st==="spin") return {lift:-Math.sin(f*Math.PI)*15,sq:Math.max(0.12,Math.abs(Math.cos(f*3*Math.PI))),dx:0,streak:1,rot:0};
  return {lift:-Math.sin(f*Math.PI)*22,sq:Math.max(0.14,Math.abs(Math.cos(f*Math.PI))),dx:0,rot:0}; }
function flipStart(m,x){ var st=m.flipStyle, y=slotY();
  if(st==="classic") FX.sparks.emit(x,y-10,6,{spread:1.2,speed:60});
  else if(st==="toss"){ setPose("celebrate",0.45); FX.sparks.emit(x,y-6,10,{spread:1.0,speed:100}); }
  else if(st==="spin") puff(x,y+6,4,"#ffffff"); }
function flipAir(m,i,dt){ if(m.flipStyle==="toss"&&Math.random()<dt*40){ var s=flipShape(m); FX.sparks.emit(slotX(i)+s.dx,slotY()+s.lift,1,{spread:6.28,speed:12}); } }
function flipLand(m,i){ var st=m.flipStyle, x=slotX(i), y=slotY();
  m.land=st==="toss"?0.3:(st==="gentle"?0.16:0.22);
  if(st==="toss"){ G.shake=Math.max(G.shake,2.5); puff(x,y+8,8); FX.embers.emit(x,y,8,{spread:2,speed:36}); thudLand(); }
  else if(st==="gentle"){ FX.steam.emit(x,y-8,4,{jitter:14}); pop(x+14,y-30,"♥","#ff8aa8",14); }
  else if(st==="spin") FX.sparks.emit(x,y,8,{spread:2.4,speed:50});
  else puff(x,y+8,4); }
function thudLand(){ if(A.ctx&&A.on) thud(A.ctx.currentTime,0.3,800); }

/* ---------- customers ---------- */
function spawnCustomer(){ var spec=CUSTOMERS[(Math.random()*CUSTOMERS.length)|0];
  var base=G.tut?9999:PH_PATIENCE[phaseIdx()]*(perk().patience||1)*(0.92+Math.random()*0.16);
  G.queue.push({spec:spec,x:W+30,pat:base,max:base,t:0,shoutT:2+Math.random()*3,taking:0}); }
function praiseFor(pt){ if(pt.def.praise&&Math.random()<0.45) return pt.def.praise[(Math.random()*pt.def.praise.length)|0];
  var n=0; ["bbq","peri","herb","baste"].forEach(function(k){ if(pt.sp[k]) n++; }); var pool;
  if(n>=3) pool=PRAISE.loaded; else if(pt.sp.baste&&pt.perfect>=2) pool=PRAISE.loaded; else if(pt.sp.peri) pool=PRAISE.peri;
  else if(pt.sp.baste) pool=PRAISE.baste; else if(pt.sp.herb) pool=PRAISE.herb; else if(pt.sp.bbq) pool=PRAISE.bbq;
  else if(pt.perfect>=2) pool=PRAISE.perfect; else pool=PRAISE.plain;
  return pool[(Math.random()*pool.length)|0]; }
function queueTop(){ return LY.queueFeet-92*LY.custScale; }
function updateQueue(dt){
  if(!G.tut) G.custT-=dt;
  if(G.custT<=0&&G.queue.length<maxQueue()){ spawnCustomer(); G.custT=PH_CUST_T[phaseIdx()]*(0.78+Math.random()*0.44); }
  else if(G.custT<=0) G.custT=1.1;
  for(var i=G.queue.length-1;i>=0;i--){
    var c=G.queue[i]; c.t+=dt; var tx=LY.queueX0+i*LY.queueGap; c.x+=(tx-c.x)*Math.min(1,dt*3.4);
    if(c.react>0) c.react-=dt;
    if(c.taking>0){ c.taking-=dt; if(c.taking<=0){ G.queue.splice(i,1); G.leavers.push({spec:c.spec,x:c.x,t:0,mood:c.served,dir:-1,v:c.served==="hot"?22:44}); } continue; }
    c.pat-=dt;
    if(i===0){ var pi=-1; for(var q=0;q<4;q++) if(G.plates[q]){ pi=q; break; }
      if(pi>=0&&Math.abs(c.x-tx)<8){ var pt=G.plates[pi]; G.plates[pi]=null;
        var plain=!pt.sp.bbq&&!pt.sp.peri&&!pt.sp.herb&&!pt.sp.baste&&pt.perfect<2;
        c.served=pt.sp.peri?"hot":(plain?"neutral":"happy");
        var spiced=!!(pt.sp.bbq||pt.sp.peri||pt.sp.herb||pt.sp.baste||pt.def.spiced);
        var v=Math.round(pt.def.pts*meatMult(pt)*G.combo*G.ch.mult*(pt.perfect>=2?RU.perfectServeBonus:1)*(perk().serveBonus||1)*(spiced?(perk().spicedBonus||1):1));
        G.score+=v; G.served++;
        bubble(c.x,queueTop()-6,praiseFor(pt),"#2a1408",2.0);
        pop(LY.plateX[pi],LY.plateY-18,"+"+v,"#ffd27a",18,"rgba(255,170,60,0.9)");
        FX.confetti.emit(LY.plateX[pi],LY.plateY-10,18,{angle:-Math.PI/2,spread:1.6,speed:140});
        FX.steam.emit(LY.plateX[pi],LY.plateY-12,4,{jitter:16});
        sfx("collect"); c.taking=0.7; tutEvent("collect"); continue; } }
    if(c.pat<=0){ bubble(c.x,queueTop()-6,"I'm off!","#8a1410",1.4); sfx("angry"); G.queue.splice(i,1); G.walkedOff++;
      G.leavers.push({spec:c.spec,x:c.x,t:0,mood:"angry",dir:1,v:78}); loseLife(c.x,queueTop()+20,"WALKED OFF!"); continue; }
    c.shoutT-=dt;
    if(c.pat/c.max<RU.leaveShout&&c.shoutT<=0){ var SH=G.loc.shouts||SHOUTS; bubble(c.x,queueTop()-6,SH[(Math.random()*SH.length)|0],"#8a1410",1.4); c.shoutT=2.4+Math.random()*2.6; if(Math.random()<0.4) sfx("angry"); } } }
var MOOD_POSE={neutral:"idle",happy:"celebrate",angry:"angry",sad:"slump",hot:"fan"};
var MOOD_RATE={neutral:1.6,happy:4,angry:5,sad:1.2,hot:7};
function custMood(c,i){ if(c.taking>0) return c.served||"happy"; if(c.react>0) return c.reactMood;
  var f=c.pat/c.max; if(i===0&&(G.plates[0]||G.plates[1]||G.plates[2]||G.plates[3])) return "happy";
  return f>0.6?"neutral":(f>0.3?"sad":"angry"); }
function custReact(mood,t){ if(!G||!G.queue) return; for(var i=0;i<G.queue.length;i++){ var c=G.queue[i]; if(c.taking>0) continue; if(c.pat/c.max>0.3){ c.react=t; c.reactMood=mood; } } }
function updateLeavers(dt){ for(var j=G.leavers.length-1;j>=0;j--){ var L=G.leavers[j]; L.t+=dt; L.x+=L.dir*L.v*dt;
  if(L.mood==="angry"&&Math.random()<dt*6) puff(L.x,LY.queueFeet,1); if(L.t>3.2||L.x<-30||L.x>W+30) G.leavers.splice(j,1); } }

/* ---------- thieves ---------- */
var KO_T=1.1;
function laneY(n){ var l=LY.lanes[n]; return l[0]+Math.random()*(l[1]-l[0]); }
function spawnThief(forceDef){
  var pi=phaseIdx(), allowed=G.loc.thieves, pool=THIEVES.filter(function(t){return t.phase<=pi&&allowed.indexOf(t.id)>=0;});
  if(!pool.length) pool=THIEVES.filter(function(t){return allowed.indexOf(t.id)>=0;}).slice(0,1);
  var fresh=pool.filter(function(t){return t.id!==G.lastType;});
  if(fresh.length) pool=fresh;
  var def=forceDef||pool[(Math.random()*pool.length)|0]; G.lastType=def.id;
  var dir=Math.random()<0.5?-1:1, edgeL=LAND?LY.panelW-34:-34, edgeR=LAND?W-LY.panelW+34:W+34;
  var th={def:def,hits:Math.max(1,def.hits-G.ch.hitCut),dir:dir,bob:Math.random()*6,stun:0,step:0,flee:0,dead:false,wind:def.id==="flanker"?0.9:0};
  var tg=pickTarget(def); th.tx=tg.x; th.ty=tg.y; th.slot=tg.slot; th.plate=tg.plate;
  if(def.id==="monkey"){ th.dir=dir=1; th.x=LY.ratDrop.x; th.y=LY.ratDrop.y; th.lane="tree"; th.fall=0.55; }
  else if(def.from==="air"){ th.x=dir<0?-28:W+28; th.y=laneY("air"); th.lane="air"; }
  else if(def.from==="low"){ th.x=dir<0?edgeL+4:edgeR-4; th.y=laneY("low"); th.lane="bottom"; }
  else { var n=["top","middle","front"][(Math.random()*3)|0]; th.x=dir<0?edgeL:edgeR; th.y=laneY(n); th.lane=n; }
  th.face=th.tx>=th.x?1:-1;
  G.thieves.push(th); playSting(def.id); if(!def.ghost) puff(th.x,th.y+def.h/2,7); }
function pickTarget(def){ var ok=[];
  for(var i=0;i<4;i++){ var m=G.slots[i]; if(!m||m.dead) continue; if(def.anyMeat||m.p>0.42||m.side===1) ok.push(i); }
  if(ok.length){ var s=ok[(Math.random()*ok.length)|0]; return {x:slotX(s),y:slotY(),slot:s,plate:-1}; }
  var pl=[]; for(var i=0;i<4;i++) if(G.plates[i]) pl.push(i);
  if(pl.length){ var p2=pl[(Math.random()*pl.length)|0]; return {x:LY.plateX[p2],y:LY.plateY,slot:-1,plate:p2}; }
  return {x:slotX(1+((Math.random()*2)|0)),y:slotY(),slot:-1,plate:-1}; }
function updateThieves(dt,d){
  for(var k=G.thieves.length-1;k>=0;k--){
    var th=G.thieves[k]; th.bob+=dt*8;
    if(th.hitT>0) th.hitT-=dt; if(th.impact>0) th.impact-=dt;
    if(th.kb>0){ th.kb-=dt; th.x-=th.kbDir*190*dt; }
    if(th.dead){ th.flee-=dt; var ko=KO_T-th.flee, kk=th.def.kind;
      if(ko<0.3) th.x-=th.kbDir*50*dt;
      else if(kk==="gull"){ th.x+=th.runDir*120*dt; th.y-=110*dt; th.step+=dt*14; }
      else if(kk==="ghost"){ th.y-=70*dt; th.x+=Math.sin(ko*9)*24*dt; }
      else if(kk!=="tok"){ th.x+=th.runDir*175*dt; th.step+=dt*14; if(Math.random()<dt*12) puff(th.x-th.runDir*8,th.y+th.def.h/2,1); }
      if(th.flee<=0){ if(kk==="tok") puff(th.x,th.y+10,10,"#8a6aa8"); G.thieves.splice(k,1); }
      continue; }
    if(th.fall>0){ th.fall-=dt; th.y+=150*dt; if(th.fall<=0) puff(th.x,th.y+12,6); continue; }
    if(th.wind>0){ th.wind-=dt; continue; }
    if(th.stun>0){ th.stun-=dt; continue; }
    var stale=(th.slot>=0&&(!G.slots[th.slot]||G.slots[th.slot].dead))||(th.plate>=0&&!G.plates[th.plate]);
    if(stale){ var nt=pickTarget(th.def); th.tx=nt.x; th.ty=nt.y; th.slot=nt.slot; th.plate=nt.plate; }
    var dx=th.tx-th.x, dy=th.ty-th.y, dist=Math.hypot(dx,dy)||1;
    var sp=th.def.spd*(0.85+d*0.2)*(th.def.id==="flanker"?RU.flankerCharge:1)*(G.tut?RU.tutorialThiefSlow:1)*(th.def.kind!=="enemy"?(perk().animalSlow||1):1);
    th.x+=dx/dist*sp*dt; th.y+=dy/dist*sp*dt; th.step+=sp*dt*0.3;
    th.face=dx>=0?1:-1; th.near=dist<40;
    if(dist<RU.stealRange&&G.tut){ th.x-=(dx>=0?1:-1)*46; th.stun=0.9; continue; }
    if(dist<RU.stealRange){
      if(th.slot>=0&&G.slots[th.slot]){ var st=G.slots[th.slot]; G.slots[th.slot]=null;
        flyaway.push({x:th.x,y:th.y-10,def:st.def,t:0,vx:th.dir*-70,vy:-40});
        loseLife(th.x,th.y-18,"SNATCHED!"); sfx("steal"); puff(th.x,th.y+16,10); G.thieves.splice(k,1); }
      else if(th.plate>=0&&G.plates[th.plate]){ var pt=G.plates[th.plate]; G.plates[th.plate]=null;
        flyaway.push({x:th.x,y:th.y-10,def:pt.def,t:0,vx:th.dir*-70,vy:-40});
        loseLife(th.x,th.y-18,"OFF THE PLATE!"); sfx("steal"); puff(th.x,th.y+16,10); G.thieves.splice(k,1); }
      else { var n2=pickTarget(th.def); th.tx=n2.x; th.ty=n2.y; th.slot=n2.slot; th.plate=n2.plate; th.stun=0.6; } } } }

/* ---------- the main update ---------- */
function update(dt){
  var sc=SCREENS[state]||{};
  if(sc.frozen||overlayOpen||(state===ST.PLAYING&&G&&G.tut&&G.tutDialog)){ schedule(); return; }
  gt+=dt; fxUpdate(dt);
  for(var i=flyaway.length-1;i>=0;i--){ var f=flyaway[i]; f.t+=dt;
    if(f.toPlate){ f.x+=(f.tx-f.x)*Math.min(1,dt*7); f.y+=(f.ty-f.y)*Math.min(1,dt*7); if(f.t>0.55) flyaway.splice(i,1); }
    else { f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=60*dt; if(f.t>1.1) flyaway.splice(i,1); } }
  for(var k in PRESS) if(PRESS[k]>0) PRESS[k]-=dt;
  /* menus and results: just music (and the state's own tick) */
  if(sc.music){ if(sc.tick) sc.tick(dt); setSong(sc.music); schedule(); setSizzle(0); return; }
  if(G.hitstop>0){ G.hitstop-=dt; schedule(); return; }
  var prevPhase=G.phase===undefined?0:G.phase;
  if(!G.tut) G.t+=dt; setSong(phaseNow().key); schedule();
  G.phase=phaseIdx();
  if(G.phase!==prevPhase){ G.banner={t:0,title:phaseNow().name.toUpperCase(),sub:"more mouths, more thieves"}; sfx("phase"); }
  if(G.banner){ G.banner.t+=dt; if(G.banner.t>2.3) G.banner=null; }
  ambience(phaseNow(),dt);
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*24);
  if(G.flash>0) G.flash=Math.max(0,G.flash-dt);
  if(G.swing>0) G.swing-=dt;
  var mv=BUDDY_MOVES[G.ch.id], pdx=G.ptx-G.px;
  if(Math.abs(pdx)>1.2){ G.px+=pdx*Math.min(1,dt*mv.ease); G.walk+=dt*mv.rate; } else { G.px=G.ptx; G.walk=0; }
  for(var q=0;q<BOOST.length;q++){ var id=BOOST[q].id; if(G.cd[id]>0) G.cd[id]-=dt; }
  var d=diff(), onGrill=0, burning=false, warning=false;
  for(var i=0;i<4;i++){ var m=G.slots[i]; if(!m) continue;
    if(m.flip>0){ m.flip-=dt; flipAir(m,i,dt); if(m.flip<=0) flipLand(m,i); }
    if(m.drop>0){ m.drop-=dt; if(m.drop<=0) m.land=0.22; }
    if(m.land>0) m.land-=dt;
    if(m.dead){ m.dead-=dt; if(m.dead<=0) G.slots[i]=null; continue; }
    onGrill++; m.p+=dt/m.dur;
    var wB=windowFor(m), sx=slotX(i), sy=slotY();
    if(m.p>wB[1]){ burning=true; if(Math.random()<dt*9) FX.burn.emit(sx,sy-8,1,{jitter:18}); }
    else if(m.p>0.45&&Math.random()<dt*3.4) FX.smoke.emit(sx,sy-10,1,{jitter:18});
    if(m.p>0.25&&m.p<=wB[1]&&Math.random()<dt*2.2) FX.steam.emit(sx,sy-6,1,{jitter:22});
    var warnAt=wB[0]+(wB[1]-wB[0])*0.62; if(m.p>=warnAt&&m.p<=wB[1]) warning=true;
    if(m.p>=wB[0]&&m.p<=wB[1]&&Math.random()<dt*10) FX.sparks.emit(sx,sy,1,{jitter:20,speed:34});
    if(G.tut&&m.p>wB[1]-0.002) m.p=wB[1]-0.002;
    if(m.p>burnAt()){ m.dead=0.7; loseLife(sx,sy-26,"BURNT!"); sfx("burn"); } }
  setSizzle(onGrill,burning);
  if(warning){ G.warnT-=dt; if(G.warnT<=0){ sfx("warn"); G.warnT=0.25; } } else G.warnT=0;
  for(var i=0;i<4;i++) if(G.plates[i]) G.plates[i].t+=dt;
  updateQueue(dt); updateLeavers(dt);
  if(!G.tut) G.thiefT-=dt;
  if(G.thiefT<=0&&G.thieves.length<maxThieves()){ spawnThief(); G.thiefT=PH_THIEF_T[phaseIdx()]*(0.68+Math.random()*0.58); }
  else if(G.thiefT<=0) G.thiefT=1.0;
  updateThieves(dt,d);
  if(Math.random()<dt*14) FX.sparks.emit(LY.gr.x+10+Math.random()*(LY.gr.w-20),LY.gr.y+20,1,{spread:0.8,speed:30});
  if(Math.random()<dt*4) FX.embers.emit(LY.gr.x+20+Math.random()*(LY.gr.w-40),LY.gr.y+14,1,{spread:0.6,speed:20});
  G.shownScore+=(G.score-G.shownScore)*Math.min(1,dt*9); if(Math.abs(G.score-G.shownScore)<1) G.shownScore=G.score;
  if(G.comboPop>0) G.comboPop-=dt; if(G.poseT>0) G.poseT-=dt;
  for(var i=0;i<4;i++) if(G.trayPop[i]>0) G.trayPop[i]-=dt;
  for(var j=G.pops.length-1;j>=0;j--){ G.pops[j].t+=dt; G.pops[j].y-=dt*24; if(G.pops[j].t>1.2) G.pops.splice(j,1); }
  for(var j=G.bursts.length-1;j>=0;j--){ G.bursts[j].t+=dt; if(G.bursts[j].t>1.0) G.bursts.splice(j,1); }
  for(var j=G.bubbles.length-1;j>=0;j--){ G.bubbles[j].t+=dt; if(G.bubbles[j].t>G.bubbles[j].d) G.bubbles.splice(j,1); } }

function playTap(mx,my){
  if(G.tut&&G.tutDialog){ G.tutDialog=false; sfx("ui"); if(!TUT[G.tutStep].wait) tutAdvance(); return; }
  if(inR(mx,my,LY.hud.pause)){ setState(ST.PAUSED); sfx("pause"); return; }
  G.swing=0.25;
  for(var k=G.thieves.length-1;k>=0;k--){
    var th=G.thieves[k]; if(th.dead) continue;
    if(LAND&&my>LY.panelY&&(mx<LY.panelW||mx>W-LY.panelW)) break;
    if(Math.hypot(mx-th.x,my-th.y)<G.ch.repel){
      th.hits--; puff(th.x,th.y+th.def.h/2,9); G.shake=4;
      th.hitT=0.22; th.impact=0.16; th.kbDir=(th.tx>=th.x?1:-1); th.kb=0; th.fall=0;
      FX.sparks.emit(th.x,th.y-4,10,{spread:6.28,speed:80});
      if(th.def.kind==="gull") FX.feathers.emit(th.x,th.y,8,{spread:6.28,speed:46});
      if(th.hits<=0){ var v=Math.round(th.def.pts*G.combo*G.ch.mult); G.score+=v;
        burst(th.x,th.y-6,KO_WORDS[(Math.random()*KO_WORDS.length)|0],"#ffb21e","#2a1000");
        pop(th.x,th.y-42,"+"+v,"#7aff9a",16,"rgba(80,255,120,0.8)");
        th.flee=KO_T; th.dead=true; th.runDir=th.x<W/2?-1:1; G.hitstop=0.07; G.shake=6; sfx("ko"); tutEvent("repel"); }
      else { burst(th.x,th.y-6,"OOF!","#ff6a2a","#2a1000"); th.kb=0.18; th.stun=0.7; }
      enemySfx(th.def.id); return; } }
  for(var i=0;i<G.foods.length;i++) if(inR(mx,my,LY.card(i,G.foods.length))){ G.selMeat=i; G.armed=null; G.trayPop[i]=0.25; sfx("tap"); return; }
  for(var i=0;i<4;i++){ var br=LY.boonRect(i), b=BOOST[i];
    if(inR(mx,my,br)){ if(G.cd[b.id]<=0){ G.armed=(G.armed===b.id)?null:b.id; sfx(b.id==="baste"?"sauce":"spice"); } else sfx("early"); return; } }
  for(var i=0;i<4;i++){ var sx=slotX(i), sy=slotY();
    if(mx>sx-34&&mx<sx+34&&my>sy-42&&my<sy+30){
      var m=G.slots[i]; G.ptx=sx;
      if(!m){ var def=G.foods[G.selMeat];
        G.slots[i]={def:def,side:0,p:0,dur:cookDur(def,null),sp:{},flip:0,dead:0,drop:0.3,perfect:0};
        sfx("place"); pop(sx,sy-38,def.name+" on","#f2e2c0",12); puff(sx,sy+6,5,"#ffb46a"); tutEvent("place"); return; }
      if(m.dead){ G.slots[i]=null; return; }
      if(G.armed){ var bb=null; for(var q=0;q<BOOST.length;q++) if(BOOST[q].id===G.armed) bb=BOOST[q];
        if(bb){ var first=!m.sp[bb.id]; m.sp[bb.id]=(+m.sp[bb.id]||0)+1;
          G.cd[bb.id]=bb.cd*G.ch.cdMul; G.armed=null; if(bb.id==="herb"&&first) m.dur*=1.18;
          sfx(bb.id==="baste"?"sauce":"spice"); var cnt=m.sp[bb.id];
          pop(sx,sy-38,bb.label+(cnt>1?" x"+cnt:"")+" +"+Math.round(bb.bonus*100)+"%",lightOf(bb.col,0.2),14);
          FX.dust.emit(sx,sy-14,10,{spread:1.6,speed:40,angle:Math.PI/2,col:bb.col}); tutEvent("season"); }
        return; }
      var win=windowFor(m);
      if(m.p<win[0]){ G.combo=1; pop(sx,sy-38,"TOO RAW","#c8b0e8",15); sfx("early"); }
      else if(m.p<=win[1]){
        var mvf=BUDDY_MOVES[G.ch.id]; m.flip=m.flipT=mvf.flipT; m.flipStyle=mvf.flip; m.perfect++; flipStart(m,sx);
        if(m.side===0){ m.side=1; m.p=0; m.dur=cookDur(m.def,m.sp);
          G.score+=Math.round(RU.flipPoints*G.combo*G.ch.mult); G.combo=Math.min(RU.comboMax,G.combo+1); G.comboPop=0.35; G.bestCombo=Math.max(G.bestCombo||1,G.combo);
          burst(sx,sy-30,"NICE!","#2ad86a","#0e2a16"); sfx("flip"); sfx("combo",G.combo); tutEvent("flip"); }
        else { var pi=-1; for(var q=0;q<4;q++) if(!G.plates[q]){ pi=q; break; }
          if(pi<0){ pop(sx,sy-38,"PLATES FULL!","#ff7a6a",15); sfx("early"); return; }
          G.plates[pi]={def:m.def,sp:m.sp,perfect:m.perfect,t:0};
          G.slots[i]=null; G.combo=Math.min(RU.comboMax,G.combo+1); G.comboPop=0.35; G.bestCombo=Math.max(G.bestCombo||1,G.combo);
          burst(sx,sy-30,"PLATED!","#ffd24a","#3a2400"); sfx("plate"); sfx("combo",G.combo); setPose("celebrate",0.7);
          FX.sparks.emit(sx,sy-6,12,{spread:2.6,speed:80});
          flyaway.push({x:sx,y:sy,def:m.def,sp:m.sp,tx:LY.plateX[pi],ty:LY.plateY,t:0,toPlate:true}); tutEvent("plate"); } }
      else { G.combo=1; pop(sx,sy-38,"BURNING!","#ff5a4a",16); sfx("early"); }
      return; } } }

/* ================= FLOW: the state machine table =================
   One entry per state (ST in 09_game.js):
     draw()       draws the whole screen
     tap(x,y)     handles a tap/click in game units
     music        menu song key; states with music don't run the game update
     frozen       true: nothing moves (pause, tutorial end)
     tick(dt)     extra per-frame work for music states
     enter(prev)  runs once when the state starts                          */

  var sc=SCREENS[state]; if(sc&&sc.tap) sc.tap(mx,my); }

       {n:"Pravesh S.",s:81300},{n:"Lwazi M.",s:70800},{n:"Ayanda G.",s:60300},{n:"Devan N.",s:50100},{n:"Zinhle B.",s:40100}]};
var BOARDS={};
CONFIG.LOCATIONS.forEach(function(l){ BOARDS[l.id]=SEEDS[l.id].slice();
  try{ var raw=localStorage.getItem(CONFIG.SAVE.scores[l.id]); if(raw){ var p=JSON.parse(raw); if(p&&p.length) BOARDS[l.id]=p; } }catch(e){} });
var scores=BOARDS.jhb;   /* the classic board, kept under its old name */
function scoresFor(id){ return BOARDS[id]||BOARDS.jhb; }
function persist(id){ id=id||"jhb"; try{ localStorage.setItem(CONFIG.SAVE.scores[id],JSON.stringify(BOARDS[id])); }catch(e){} }
function addScore(name,sc,id){ id=id||(G&&G.loc?G.loc.id:"jhb"); var b=scoresFor(id); b.forEach(function(s){ delete s.me; });
  b.push({n:(name||"Braai Buddy").substring(0,14),s:sc,me:true}); b.sort(function(a,c){return c.s-a.s;}); BOARDS[id]=b.slice(0,12); if(id==="jhb") scores=BOARDS.jhb; persist(id); }

var GAME_LINK="https://mtshamano.github.io/Braai_Buddies/";
var nameBox=document.getElementById("nameBox"), nameIn=document.getElementById("nameIn");
var cardBox=document.getElementById("cardBox"), cardCv=document.getElementById("cardCanvas"), cardCx=cardCv.getContext("2d");
var toastEl=document.getElementById("toast"), overlayOpen=false;
function toast(msg){ toastEl.textContent=msg; toastEl.style.display="block"; clearTimeout(toastEl._t); toastEl._t=setTimeout(function(){ toastEl.style.display="none"; },2600); }
function openName(){ overlayOpen=true; nameBox.style.display="block"; nameIn.value=""; nameIn.focus(); }
function closeName(){ overlayOpen=false; nameBox.style.display="none"; }

/* the share card: drawn in the game's painted style, 1080x1080 */
function renderShareCard(){
  var keep=ctx, c=cardCx; ctx=c;
  c.setTransform(3,0,0,3,0,0);
  var g=c.createLinearGradient(0,0,0,360); g.addColorStop(0,"#120720"); g.addColorStop(0.5,"#3a0f34"); g.addColorStop(1,"#5a1a1a"); c.fillStyle=g; c.fillRect(0,0,360,360);
  var rg=c.createRadialGradient(180,330,10,180,330,260); rg.addColorStop(0,"rgba(255,130,50,0.6)"); rg.addColorStop(1,"rgba(255,80,40,0)"); c.fillStyle=rg; c.fillRect(0,0,360,360);
  for(var i=0;i<50;i++){ c.fillStyle="rgba(255,"+(140+i%80)+",80,"+(0.25+(i%4)*0.12)+")"; c.beginPath(); c.arc((i*97)%360,120+(i*53)%240,0.8+(i%3)*0.6,0,7); c.fill(); }
  c.strokeStyle="#5a3a1a"; c.lineWidth=6; c.strokeRect(10,10,340,340); c.strokeStyle="#d8a24a"; c.lineWidth=2; c.strokeRect(10,10,340,340);
  if(IMG_LOGO.complete&&IMG_LOGO.naturalWidth){ var lw=230, lh=lw/LOGO_AR; c.drawImage(IMG_LOGO,180-lw/2,22,lw,lh); }
  var ch=G?G.ch:CHARS[0];
  c.save(); c.translate(84,330); c.scale(1.5,1.5); drawPerson(c,ch.spec,"front","celebrate",0,null,LIGHTS.F); c.restore();
  txt("MY BRAAI SCORE",232,164,14,"#ff9a4a","center");
  if(G&&G.loc) body("in "+G.loc.name,232,180,11,"#e0c8a0","center","700");
  num((G?G.score:0).toLocaleString(),232,222,46,"#ffd27a","center");
  txt("POINTS",232,242,10,"#e0c8a0","center");
  txt("Can you beat me?",232,280,15,"#f2e2c0","center");
  body((G&&G.playerName)?G.playerName:"Braai Buddy",232,302,12,"#ffd8a0","center","700");
  body(GAME_LINK.replace("https://",""),180,340,9,"#c8a0b0","center","600");
  c.setTransform(1,0,0,1,0,0); ctx=keep; }
function openCard(){ overlayOpen=true; renderShareCard(); cardBox.style.display="block"; }
function closeCard(){ overlayOpen=false; cardBox.style.display="none"; }
function shareTextShort(){ return "🔥 I just scored "+(G?G.score.toLocaleString():0)+" on Braai Buddies"+(G&&G.loc?" in "+G.loc.name:"")+"! Can you beat me? 🍖 "+GAME_LINK; }
function shareTextLinkedIn(){ return "I just played Braai Buddies, a South African-themed browser game where you run a braai — managing the fire, "+
  "seasoning the meat, keeping a queue of hungry customers happy, and fending off thieves (yes, even a tokoloshe). Scored "+(G?G.score.toLocaleString():0)+
  " points. Give it a try and see if you can beat it: "+GAME_LINK+" 🍖🔥"; }
function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(function(){ legacyCopy(t); }); else legacyCopy(t); }
function legacyCopy(t){ var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); }
function cardBlob(cb){ cardCv.toBlob(function(b){ cb(b); },"image/png"); }
function downloadCard(){ var a=document.createElement("a"); a.href=cardCv.toDataURL("image/png"); a.download="braai-buddies-score.png"; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
/* try the installed app first; fall back to the web if the page is still visible */
function openAppThenWeb(appUrl,webUrl){ var left=false; function markLeft(){ left=true; }
  document.addEventListener("visibilitychange",markLeft,{once:true}); window.addEventListener("blur",markLeft,{once:true});
  window.location.href=appUrl;
  setTimeout(function(){ document.removeEventListener("visibilitychange",markLeft); window.removeEventListener("blur",markLeft); if(!left) window.open(webUrl,"_blank"); },1100); }
document.getElementById("nameSave").addEventListener("click",function(){ var nm=nameIn.value.trim(); addScore(nm,G?G.score:0);
  if(G){ G.saved=true; G.playerName=nm||"Braai Buddy"; } closeName(); });
document.getElementById("nameCancel").addEventListener("click",closeName);
document.getElementById("cardClose").addEventListener("click",closeCard);
document.getElementById("nativeShare").addEventListener("click",function(){ cardBlob(function(blob){
  var file=new File([blob],"braai-buddies-score.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[file]})) navigator.share({files:[file],title:"Braai Buddies",text:shareTextShort()}).catch(function(){});
  else if(navigator.share) navigator.share({title:"Braai Buddies",text:shareTextShort(),url:GAME_LINK}).catch(function(){});
  else { downloadCard(); copyText(shareTextShort()); toast("Image saved & caption copied!"); } }); });
document.getElementById("shareWA").addEventListener("click",function(){ downloadCard(); var t=shareTextShort(); copyText(t);
  openAppThenWeb("whatsapp://send?text="+encodeURIComponent(t),"https://wa.me/?text="+encodeURIComponent(t)); toast("Caption copied & image saved — paste the caption and attach the image!"); });
document.getElementById("shareX").addEventListener("click",function(){ var t=shareTextShort(); copyText(t);
  openAppThenWeb("twitter://post?message="+encodeURIComponent(t),"https://twitter.com/intent/tweet?text="+encodeURIComponent(t)); });
document.getElementById("shareLI").addEventListener("click",function(){ copyText(shareTextLinkedIn());
  openAppThenWeb("linkedin://","https://www.linkedin.com/sharing/share-offsite/?url="+encodeURIComponent(GAME_LINK)); toast("Caption copied — paste it into your LinkedIn post, then attach the image!"); });
document.getElementById("shareIG").addEventListener("click",function(){ copyText(shareTextShort());
  cardBlob(function(blob){ try{ if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write) navigator.clipboard.write([new ClipboardItem({"image/png":blob})]).catch(function(){ downloadCard(); }); else downloadCard(); }catch(e){ downloadCard(); } });
  openAppThenWeb("instagram://app","https://www.instagram.com/"); toast("Caption & image copied — paste them into a new Instagram post!"); });
document.getElementById("cardDownload").addEventListener("click",function(){ downloadCard(); toast("Image saved!"); });

/* ================= MAIN: quality, warm-up, loop, boot ================= */
var IS_PHONE=(function(){ try{ var coarse=window.matchMedia&&matchMedia("(pointer: coarse)").matches, small=Math.min(screen.width,screen.height)<=900;
  return !!(coarse&&small)||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent); }catch(e){ return false; } })();
/* High: glows, film grain, full particles. Low: fewer particles, no glow
   halos or grain. Low is picked automatically if the first seconds of
   play run slower than about 40fps, and either can be set on the pause screen. */
var QUALITY={high:true,grain:true,auto:true,probe:[]};
(function(){ try{ var q=JSON.parse(localStorage.getItem("braaiBuddiesQ2")||"null"); if(q){ QUALITY.high=q.high; QUALITY.grain=q.grain; QUALITY.auto=false; } }catch(e){} })();
function saveQuality(){ try{ localStorage.setItem("braaiBuddiesQ2",JSON.stringify({high:QUALITY.high,grain:QUALITY.grain})); }catch(e){} }
function applyQuality(){ var lo=!QUALITY.high;
  FX.sparks.max=lo?30:70; FX.smoke.max=lo?18:40; FX.burn.max=lo?14:30; FX.embers.max=lo?12:40; FX.steam.max=lo?10:30; FX.feathers.max=lo?10:24; FX.confetti.max=lo?40:90; }
function qualityProbe(dt){ if(!QUALITY.auto||state!=="play"||QUALITY.probe.length>=180) return;
  QUALITY.probe.push(dt);
  if(QUALITY.probe.length===180){ var srt=QUALITY.probe.slice(30).sort(function(a,b){return a-b;}), med=srt[srt.length>>1];
    if(med>1/40&&QUALITY.high){ QUALITY.high=false; applyQuality(); if(G) pop(W/2,H*0.4,"Low quality on for smoother play","#c8b0e8",12); } } }

/* ---------- warm-up: bake upcoming art a little each frame ---------- */
var WARM=[];
function onBakesCleared(){ WARM=null; GRAIN_PAT=null; }
function buildWarm(){ WARM=[];
  var phi=G&&state==="play"?phaseIdx():0;
  [phi,Math.min(3,phi+1)].forEach(function(p){ WARM.push(function(){ sceneLayer(PHASES[p],curLoc()); }); });
  (G?G.foods:foodsFor(LOCS[SAVE.lastLoc]||LOCS.jhb)).forEach(function(m){ for(var s=0;s<5;s++) (function(s){ WARM.push(function(){ cutSprite(m.id,s,LAND?0.72:0.84); }); })(s); });
  var ch=CHARS[sel];
  ["idle","walk","tong","celebrate","panic","burnt"].forEach(function(p){ for(var f=0;f<(PERSON_FRAMES[p]||1);f++) (function(f){ WARM.push(function(){ personSprite(ch.spec,"back",p,f,null,"B",LY.playerScale); }); })(f); });
  THIEVES.forEach(function(d){ if(d.phase>phi+1) return; if(G&&G.loc.thieves.indexOf(d.id)<0) return;
    if(d.kind==="enemy"){ for(var st in THIEF_LOOK){ (function(st){ var L=thiefLook(d,st); for(var f=0;f<(PERSON_FRAMES[L[0]]||1);f++) (function(f){ WARM.push(function(){ personSprite(CAST_ENEMY[d.id],"front",L[0],f,L[1],"T",LY.thiefScale); }); })(f); })(st); } }
    else for(var st in CR_FRAMES) for(var f=0;f<CR_FRAMES[st];f++) (function(st,f){ WARM.push(function(){ critterSprite(d.kind,st,f,LY.thiefScale*1.15); }); })(st,f); });
  CUSTOMERS.forEach(function(sp){ for(var f=0;f<2;f++) (function(f){ WARM.push(function(){ personSprite(sp,"front","idle",f,"neutral","F",LY.custScale); }); })(f); });
  WARM.reverse(); }
var WARM_PHASE=-1;
function warmStep(budget){
  var ph=G&&state==="play"?phaseIdx():0; if(ph!==WARM_PHASE){ WARM_PHASE=ph; WARM=null; }
  if(WARM===null) buildWarm(); if(!WARM.length) return; var t0=performance.now();
  while(WARM.length&&performance.now()-t0<budget){ try{ WARM.pop()(); }catch(e){} } }

/* ---------- loop ---------- */
var tPrev=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-tPrev)/1000); tPrev=now;
  if(state===ST.MENU||state===ST.DEVICE||state===ST.CARD) CHOICE=null;
  var want=CHOICE?CHOICE==="pc":(window.innerWidth>window.innerHeight);
  if(want!==LAND) setLayout(want);
  update(dt);
  ctx.setTransform(S,0,0,S,0,0); ctx.clearRect(0,0,W,H);
  (SCREENS[state]||SCREENS[ST.MENU]).draw();
  grain(); drawWipe(dt); qualityProbe(dt);
  warmStep(state==="play"?1.5:6);
  requestAnimationFrame(frame); }

/* ---------- input ---------- */
cv.addEventListener("pointerdown",function(e){ e.preventDefault(); var r=cv.getBoundingClientRect(); tap((e.clientX-r.left)/FIT,(e.clientY-r.top)/FIT); },{passive:false});
window.addEventListener("resize",function(){ resize(); });
window.addEventListener("keydown",function(e){ if(e.key==="Escape"||e.key==="p"){ if(state===ST.PLAYING){ setState(ST.PAUSED); sfx("pause"); } else if(state===ST.PAUSED){ setState(ST.PLAYING); sfx("pause"); } } });

/* ---------- boot ---------- */
setLayout(LAND); makeFxSprites(); applyQuality(); initAmbient();
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load("900 20px Cinzel"),document.fonts.load("700 20px Oswald")]).then(function(){ LAYERS={}; }).catch(function(){}); }
requestAnimationFrame(frame);

})();
