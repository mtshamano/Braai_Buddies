<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Braai Buddies</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0812;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;}
  #wrap{position:relative;line-height:0;}
  #c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
  #u{position:absolute;left:0;top:0;image-rendering:auto;pointer-events:none;}
  .ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:78%;max-width:300px;background:#221838;border:3px solid #f2873a;
      border-radius:10px;padding:16px;box-sizing:border-box;display:none;z-index:9;
      box-shadow:0 8px 30px rgba(0,0,0,.6);}
  .ov h3{margin:0 0 10px;color:#ffdf82;font-size:15px;text-align:center;font-weight:800;}
  .ov input{width:100%;box-sizing:border-box;padding:10px;border-radius:6px;
      border:2px solid #4d3f6e;background:#150f26;color:#efe3c6;font-size:15px;
      font-family:inherit;margin-bottom:10px;-webkit-user-select:text;user-select:text;}
  .ov .row{display:flex;gap:8px;}
  .ov button{flex:1;padding:11px 8px;border:none;border-radius:6px;cursor:pointer;
      font-family:inherit;font-weight:800;font-size:13px;background:#f2873a;color:#3a1c00;}
  .ov button.alt{background:#3d3059;color:#efe3c6;}
  .ov p{margin:0 0 8px;color:#c8b6da;font-size:11px;text-align:center;line-height:1.4;}
  #cardBox{max-width:340px;}
  #cardBox canvas{width:100%;border-radius:8px;display:block;margin-bottom:10px;
      box-shadow:0 4px 18px rgba(0,0,0,.5);}
    .platrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .plat{padding:10px 6px;border:none;border-radius:6px;cursor:pointer;font-family:inherit;
      font-weight:800;font-size:12px;color:#fff;}
  .plat.wa{background:#25d366;color:#0a2e18;}
  .plat.x{background:#111;color:#fff;border:1px solid #444;}
  .plat.li{background:#0a66c2;}
  .plat.ig{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);}
  .toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
      background:#1a2e14;color:#c8ff4a;border:2px solid #c8ff4a;border-radius:6px;
      padding:8px 14px;font-size:12px;font-weight:700;z-index:20;display:none;
      font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}

</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="640"></canvas>
  <canvas id="u" width="1080" height="1920"></canvas>

  <div class="ov" id="nameBox">
    <h3>Save your score</h3>
    <input id="nameIn" maxlength="14" placeholder="Your name" autocomplete="off">
    <div class="row">
      <button id="nameSave">SAVE</button>
      <button class="alt" id="nameCancel">CANCEL</button>
    </div>
  </div>

  <div class="ov" id="cardBox">
    <h3>Share your score</h3>
    <canvas id="cardCanvas" width="1080" height="1080"></canvas>
    <p>Tap a platform below. Your caption and image are copied for you automatically — just paste them into the post before you share it.</p>
    <button id="nativeShare" style="width:100%;margin-bottom:8px;background:#f2873a;color:#3a1c00;">SHARE (choose an app)</button>
    <div class="platrow">
      <button class="plat wa" id="shareWA">WhatsApp</button>
      <button class="plat x" id="shareX">X / Twitter</button>
      <button class="plat li" id="shareLI">LinkedIn</button>
      <button class="plat ig" id="shareIG">Instagram</button>
    </div>
    <div class="row">
      <button id="cardDownload" class="alt">DOWNLOAD IMAGE</button>
      <button class="alt" id="cardClose">CLOSE</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

function renderShareCard(){
  var W2=1080,H2=1080, cx=cardCx;
  var g=cx.createLinearGradient(0,0,0,H2);
  g.addColorStop(0,"#0c1f13"); g.addColorStop(1,"#152b1c");
  cx.fillStyle=g; cx.fillRect(0,0,W2,H2);
  cx.fillStyle="#0f2416";
  for(var i=0;i<70;i++){ var dx=(i*137)%W2, dy=(i*211)%H2; cx.fillRect(dx,dy,4,4); }
  cx.strokeStyle="#c8ff4a"; cx.lineWidth=16; cx.strokeRect(24,24,W2-48,H2-48);
  cx.strokeStyle="#ffb23a"; cx.lineWidth=4; cx.strokeRect(44,44,W2-88,H2-88);

  cx.textAlign="center";
  if(IMG_LOGO.complete&&IMG_LOGO.naturalWidth){
    var lw=700, lh=lw/LOGO_AR;
    cx.drawImage(IMG_LOGO,(W2-lw)/2,86,lw,lh);
  } else {
    cx.font="800 90px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif";
    cx.fillStyle="#ff8a3a"; cx.fillText("BRAAI BUDDIES",W2/2,200);
  }

  var score=(G?G.score:0);

  cx.font="800 52px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif";
  cx.fillStyle="#c8ff4a";
  cx.fillText("MY BRAAI SCORE",W2/2,480);

  cx.font="800 148px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif";
  cx.fillStyle="#ffb23a";
  cx.fillText(score.toLocaleString(),W2/2,655);
  cx.font="700 38px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif";
  cx.fillStyle="#d8ffb0"; cx.fillText("POINTS",W2/2,700);

  cx.font="800 58px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif";
  cx.fillStyle="#ffffff"; cx.fillText("Can you beat me? \uD83C\uDF56",W2/2,812);

  cx.font="600 34px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif";
  cx.fillStyle="#9be86a";
  cx.fillText((G&&G.playerName)?G.playerName:"Braai Buddy",W2/2,900);

  cx.font="500 28px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif";
  cx.fillStyle="#7fae74";

function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).catch(function(){ legacyCopy(txt); });
  } else legacyCopy(txt);
}
function legacyCopy(txt){
  var ta=document.createElement("textarea"); ta.value=txt;
  ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
function cardBlob(cb){ cardCv.toBlob(function(b){ cb(b); },"image/png"); }

  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:"Braai Buddies",text:shareTextShort()}).catch(function(){});

      downloadCard(); copyText(shareTextShort());
      toast("Image saved & caption copied!");
    }
  });
});
/* try the native app via its URL scheme first; only fall back to the
   web version if the app doesn't take over the page within ~1.1s.
   This is the standard "app link" pattern -- it can't be made 100%
   certain from a webpage (no browser exposes "is app installed"),
   but it reliably hands off to the installed app on phones. */
function openAppThenWeb(appUrl,webUrl,onAppLikely){
  var left=false;
  function markLeft(){ left=true; }
  document.addEventListener("visibilitychange",markLeft,{once:true});
  window.addEventListener("blur",markLeft,{once:true});
  window.location.href=appUrl;
  setTimeout(function(){
    document.removeEventListener("visibilitychange",markLeft);
    window.removeEventListener("blur",markLeft);
    if(!left){ window.open(webUrl,"_blank"); }
    else if(onAppLikely){ onAppLikely(); }
  },1100);
}

});

document.getElementById("shareLI").addEventListener("click",function(){
  /* LinkedIn has no public scheme for a pre-filled post, on the app or
     the web -- they removed prefilled text years ago. Best available:
     copy the caption, then hand off to the app if it's installed so
     you can paste it straight into a new post. */
  copyText(shareTextLinkedIn());
  openAppThenWeb(
    "linkedin://",
    "https://www.linkedin.com/sharing/share-offsite/?url="+encodeURIComponent(GAME_LINK)
  );
  toast("Caption copied — paste it into your LinkedIn post, then attach the image!");
});
document.getElementById("shareIG").addEventListener("click",function(){
  /* Instagram has no share-intent scheme at all for a normal web page --
     posting requires their native SDK. Copy caption + image, then open
     the app so you can paste/attach it yourself. */
  copyText(shareTextShort());
  cardBlob(function(blob){
    try{
      if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
        navigator.clipboard.write([new ClipboardItem({"image/png":blob})]).catch(function(){ downloadCard(); });
      } else downloadCard();
    }catch(e){ downloadCard(); }
  });
  openAppThenWeb("instagram://app","https://www.instagram.com/");
  toast("Caption & image copied — paste them into a new Instagram post!");
});

  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);

  var s=STINGS[id]||STINGS.neighbour,t=A.ctx.currentTime+0.02;
  for(var i=0;i<s.length;i++){ tone(nf(s[i][0]),t,s[i][1]*1.5,"square",0.13); t+=s[i][1]; } }
function setSong(n){ if(!A.ctx) return; var s=SONGS[n]; if(!s||A.song===s) return;

  A.tracks=s.tracks.map(function(tr){return {tr:tr,i:0,beat:0};}); }
function schedule(){ if(!A.ctx||!A.song||!A.on) return;
  var bd=60/A.bpm,nb=(A.ctx.currentTime-A.startT)/bd;
  for(var k=0;k<A.tracks.length;k++){ var st=A.tracks[k],tr=st.tr,guard=0;
    while(st.beat<nb+2&&guard++<64){ var n=tr.notes[st.i],t=A.startT+st.beat*bd;
      if(n[0]!=="-"){ if(tr.type==="drum") hit(t,0.09,tr.vol,1600,A.mGain);

function tutAdvance(){
  G.tutStep++;
  if(G.tutStep>=TUT.length){ state="tutend"; sfx("start"); return; }
  var st=TUT[G.tutStep];
  if(st.setup) st.setup();
  G.tutDialog=true;
}
function tutEvent(name){
  if(!G||!G.tut||G.tutDialog||state!=="play") return;
  var st=TUT[G.tutStep];
  if(st&&st.wait===name) tutAdvance();
}
function phaseIdx(){ return Math.min(3,Math.floor(G.t/PHASE_LEN)); }
function phaseNow(){ return PHASES[phaseIdx()]; }

function starPath(c,x,y,rO,rI,pts,rot){
  c.beginPath();
  for(var i=0;i<pts*2;i++){ var r=(i%2===0)?rO:rI, a=rot+(i/(pts*2))*Math.PI*2;
    var px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
    if(i===0) c.moveTo(px,py); else c.lineTo(px,py); }
  c.closePath(); }
function drawBursts(){
  for(var i=0;i<G.bursts.length;i++){
    var b=G.bursts[i];
    var grow=b.t<0.14?(b.t/0.14):1;
    var s=grow*(1+Math.sin(Math.min(1,b.t*6))*0.06);
    var fade=b.t>0.55?Math.max(0,1-(b.t-0.55)/0.45):1;
    ctx.globalAlpha=fade;
    starPath(ctx,b.x,b.y,30*s+3,18*s+3,b.pts,b.rot); ctx.fillStyle=b.edge; ctx.fill();
    starPath(ctx,b.x,b.y,30*s,18*s,b.pts,b.rot); ctx.fillStyle=b.fill; ctx.fill();
    starPath(ctx,b.x,b.y,18.6*s,11*s,b.pts,b.rot+0.3); ctx.fillStyle="#ffffff2e"; ctx.fill();
    ctx.globalAlpha=1;
    uctx.save(); uctx.globalAlpha=fade;
    uctx.translate(b.x,b.y); uctx.rotate(b.rot);
    var fs=Math.max(8,15*s);
    T(b.w,0,fs*0.36,fs,b.tc,"center","800",3.5,"#ffffffcc");

function drawBubbles(){

function spawnCustomer(){
  var pl=CUST_PALS[(Math.random()*CUST_PALS.length)|0];

function praiseFor(pt){
  var n=0; ["bbq","peri","herb","baste"].forEach(function(k){ if(pt.sp[k]) n++; });
  var pool;
  if(n>=3) pool=PRAISE.loaded;
  else if(pt.sp.baste&&pt.perfect>=2) pool=PRAISE.loaded;
  else if(pt.sp.peri) pool=PRAISE.peri;
  else if(pt.sp.baste) pool=PRAISE.baste;
  else if(pt.sp.herb) pool=PRAISE.herb;
  else if(pt.sp.bbq) pool=PRAISE.bbq;
  else if(pt.perfect>=2) pool=PRAISE.perfect;
  else pool=PRAISE.plain;
  return pool[(Math.random()*pool.length)|0]; }
function updateQueue(dt){
  if(!G.tut) G.custT-=dt;

    spawnCustomer();
    G.custT=PH_CUST_T[phaseIdx()]*(0.78+Math.random()*0.44);
  } else if(G.custT<=0) G.custT=1.1;

    c.x+=(tx-c.x)*Math.min(1,dt*3.4);
    if(c.taking>0){ c.taking-=dt; if(c.taking<=0) G.queue.splice(i,1); continue; }
    c.pat-=dt;
    if(i===0){
      var pi=-1; for(var q=0;q<4;q++) if(G.plates[q]){ pi=q; break; }
      if(pi>=0&&Math.abs(c.x-tx)<8){
        var pt=G.plates[pi]; G.plates[pi]=null;
        var v=Math.round(pt.def.pts*meatMult(pt)*G.combo*G.ch.mult*(pt.perfect>=2?1.15:1));
        G.score+=v; G.served++;
        bubble(c.x,QUEUE_Y-32,praiseFor(pt),"#2a1c10",2.0);
        pop(PLATE_X[pi],PLATE_Y-16,"+"+v,P.goldHi,17);
        sfx("collect"); c.taking=0.7; tutEvent("collect"); continue; } }
    if(c.pat<=0){
      bubble(c.x,QUEUE_Y-32,"I'm off!",P.redLo,1.4); sfx("angry");
      G.queue.splice(i,1); G.walkedOff++;

    if(c.pat/c.max<0.45&&c.shoutT<=0){

/* ================= thieves ================= */
function spawnThief(forceDef){
  var pi=phaseIdx(),pool=THIEVES.filter(function(t){return t.phase<=pi;});
  var fresh=pool.filter(function(t){return t.id!==G.lastType;});
  if(fresh.length) pool=fresh;
  var def=forceDef||pool[(Math.random()*pool.length)|0]; G.lastType=def.id;
  var dir=Math.random()<0.5?-1:1;
  var th={def:def,hits:Math.max(1,def.hits-G.ch.hitCut),dir:dir,bob:Math.random()*6,
          stun:0,step:0,flee:0,dead:false,wind:def.id==="flanker"?0.9:0};
  var tg=pickTarget(def); th.tx=tg.x; th.ty=tg.y; th.slot=tg.slot; th.plate=tg.plate;
  if(def.id==="monkey"){
    /* Alex Rat lets go of a branch and drops out of a tree */
    th.x=dir<0?24:336; th.y=196; th.lane="tree"; th.fall=0.55;
  } else if(def.from==="air"){
    /* from the sky, above the serving table */
    th.x=dir<0?-28:W+28; th.y=150+Math.random()*50; th.lane="air";
  } else if(def.from==="low"){
    /* crawls in along the very bottom of the yard */
    th.x=dir<0?-28:W+28; th.y=GRATE.y+100+Math.random()*16; th.lane="bottom";
  } else {
    /* walkers use one of three lanes: behind the table, mid yard, or the front */
    var lanes=[
      {y:308+Math.random()*10,n:"top"},
      {y:352+Math.random()*14,n:"middle"},
      {y:GRATE.y+48+Math.random()*14,n:"front"}
    ];
    var L=lanes[(Math.random()*lanes.length)|0];
    th.x=dir<0?-34:W+34; th.y=L.y; th.lane=L.n;
  }
  G.thieves.push(th); playSting(def.id);
  if(!def.ghost) puff(th.x,th.y+def.h/2,7); }
function pickTarget(def){
  var ok=[];
  for(var i=0;i<4;i++){ var m=G.slots[i]; if(!m||m.dead) continue;
    if(def.anyMeat||m.p>0.42||m.side===1) ok.push(i); }
  if(ok.length){ var s=ok[(Math.random()*ok.length)|0]; return {x:SLOT_X[s],y:SLOT_Y,slot:s,plate:-1}; }
  var pl=[]; for(var i=0;i<4;i++) if(G.plates[i]) pl.push(i);
  if(pl.length){ var p2=pl[(Math.random()*pl.length)|0];
    return {x:PLATE_X[p2],y:PLATE_Y,slot:-1,plate:p2}; }
  return {x:SLOT_X[1+((Math.random()*2)|0)],y:SLOT_Y,slot:-1,plate:-1}; }

/* ================= update ================= */
function update(dt){
  if(state==="paused"||state==="tutend"||overlayOpen||(state==="play"&&G&&G.tut&&G.tutDialog)){ schedule(); return; }
  gt+=dt;
  for(var i=0;i<clouds.length;i++){ clouds[i].x+=clouds[i].v*dt; if(clouds[i].x>W+50) clouds[i].x=-60; }
  for(var i=0;i<birds.length;i++){ birds[i].x+=birds[i].v*dt; birds[i].p+=dt*9; if(birds[i].x>W+30) birds[i].x=-30; }
  for(var i=0;i<embers.length;i++){ var e=embers[i]; e.y-=e.v*dt; e.p+=dt*3;
    if(e.y<-6){ e.y=H+6; e.x=Math.random()*W; } }
  for(var i=dust.length-1;i>=0;i--){ var d=dust[i]; d.t+=dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.vy+=110*dt; if(d.t>0.8) dust.splice(i,1); }
  for(var i=flyaway.length-1;i>=0;i--){ var f=flyaway[i]; f.t+=dt;
    if(f.toPlate){ f.x+=(f.tx-f.x)*Math.min(1,dt*7); f.y+=(f.ty-f.y)*Math.min(1,dt*7); if(f.t>0.55) flyaway.splice(i,1); }
    else { f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=60*dt; if(f.t>1.1) flyaway.splice(i,1); } }
  if(state==="title"||state==="card"){ setSong("title"); schedule(); return; }
  if(state==="select"||state==="mode"||state==="howto"||state==="enemies"||state==="scores"){ setSong("menu"); schedule(); return; }
  if(state==="over"){ schedule(); return; }

  var prevPhase=G.phase===undefined?0:G.phase;
  if(!G.tut) G.t+=dt; setSong(phaseNow().key); schedule();
  G.phase=phaseIdx();
  if(G.phase!==prevPhase){
    burst(W/2,300,phaseNow().name.toUpperCase()+"!",P.ember,"#7a2c08","#fff2e2");
    pop(W/2,268,"more mouths, more thieves",P.goldHi,15);
  }
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*24);
  if(G.flash>0) G.flash=Math.max(0,G.flash-dt);
  if(G.swing>0) G.swing-=dt;
  var pdx=G.ptx-G.px;
  if(Math.abs(pdx)>1.2){ G.px+=pdx*Math.min(1,dt*6.2); G.walk+=dt*11; }
  else { G.px=G.ptx; G.walk=0; }
  for(var q=0;q<BOOST.length;q++){ var id=BOOST[q].id; if(G.cd[id]>0) G.cd[id]-=dt; }
  var d=diff();
  for(var i=0;i<4;i++){
    var m=G.slots[i]; if(!m) continue;
    if(m.flip>0) m.flip-=dt;
    if(m.drop>0) m.drop-=dt;
    if(m.dead){ m.dead-=dt; if(m.dead<=0) G.slots[i]=null; continue; }
    m.p+=dt/m.dur;
    if(m.p>0.45&&Math.random()<dt*3.4) smoke.push({x:SLOT_X[i]+(Math.random()*18-9),y:SLOT_Y-10,t:0,v:12+Math.random()*10});
    var win=windowFor(m);
    if(m.p>=win[0]&&m.p<=win[1]&&Math.random()<dt*10)
      sparks.push({x:SLOT_X[i]+(Math.random()*20-10),y:SLOT_Y,t:0,v:26+Math.random()*16,c:P.goldHi});
    if(G.tut&&m.p>win[1]-0.002) m.p=win[1]-0.002;
    if(m.p>1.25){ m.dead=0.7; loseLife(SLOT_X[i],SLOT_Y-26,"BURNT!"); sfx("burn"); } }
  for(var i=0;i<4;i++) if(G.plates[i]) G.plates[i].t+=dt;
  updateQueue(dt);
  if(!G.tut) G.thiefT-=dt;
  if(G.thiefT<=0&&G.thieves.length<maxThieves()){
    spawnThief();
    G.thiefT=PH_THIEF_T[phaseIdx()]*(0.68+Math.random()*0.58);
  } else if(G.thiefT<=0){ G.thiefT=1.0; }

  for(var i=smoke.length-1;i>=0;i--){ var s=smoke[i]; s.t+=dt; s.y-=s.v*dt; s.x+=Math.sin(s.t*3)*9*dt; if(s.t>2.4) smoke.splice(i,1); }

    ctx.globalAlpha=Math.max(0,0.32*(1-s.t/2.4)); R(s.x,s.y,8+s.t*5,7+s.t*4,"#e8e8f0"); ctx.globalAlpha=1; }

  var ppx=2,pm=HUMAN_BACK,pw=spriteW(pm,ppx),phh=spriteH(pm,ppx);
  var moving=Math.abs(G.ptx-G.px)>1.2;
  var hop=moving?Math.abs(Math.sin(G.walk))*3:Math.sin(gt*2)*1.5;
  var lean=moving?Math.sin(G.walk)*1.6:0;
  var pbx=G.px-pw/2+lean, pby=452-hop;
  shadow(G.px,452+phh-6,24,6,moving?0.20:0.26);
  if(moving) for(var i=0;i<2;i++) R(G.px-14+i*26,452+phh-8,4,3,"#00000030");
  sprite(pm,G.ch.pal,pbx,pby,ppx);
  var tsw=(G.swing>0?1:0)*Math.sin(gt*30)*5 + (moving?Math.sin(G.walk)*3:0);
  R(pbx+pw-2,pby+20+tsw,4,28,P.steel); R(pbx+pw-2,pby+20+tsw,4,5,P.steelHi);
  if(moving&&Math.random()<0.25) puff(G.px-Math.sign(G.ptx-G.px)*12,452+phh-6,1,"#cdbfa6");

  for(var i=0;i<G.thieves.length;i++) drawThief(G.thieves[i]);
  for(var i=0;i<dust.length;i++){ var dp=dust[i]; ctx.globalAlpha=Math.max(0,1-dp.t/0.8);
    R(dp.x,dp.y,3,3,dp.c); ctx.globalAlpha=1; }
  for(var i=0;i<flyaway.length;i++){ var f=flyaway[i];
    ctx.globalAlpha=f.toPlate?1:Math.max(0,1-f.t/1.1);
    meatSprite(f.def,f.x,f.y,f.def.done,f.def.doneHi,f.def.char,0.6,null); ctx.globalAlpha=1; }

  if(ph.dark>0){
    ctx.fillStyle="rgba(10,6,26,"+ph.dark+")"; ctx.fillRect(0,0,W,H);
    var g=ctx.createRadialGradient(W/2,GRATE.y+16,12,W/2,GRATE.y+16,210);
    g.addColorStop(0,"rgba(255,168,78,0.34)"); g.addColorStop(1,"rgba(255,168,78,0)");
    ctx.fillStyle=g; ctx.fillRect(0,180,W,460); }

  drawBursts(); drawBubbles();
  for(var i=0;i<G.pops.length;i++){ var p=G.pops[i];
    uctx.globalAlpha=Math.max(0,1-p.t/1.25);
    T(p.s,p.x,p.y,p.t<0.1?p.size*(0.6+p.t*4):p.size,p.c,"center","800",4);
    uctx.globalAlpha=1; }
  ctx.restore(); uctx.restore();

  drawBoosters(); drawTray(); drawHUD();
  if(G.flash>0){ ctx.fillStyle="rgba(224,74,58,"+(G.flash*0.5)+")"; ctx.fillRect(0,0,W,H); }
}
function drawBoosters(){
  R(0,504,W,56,"rgba(16,11,26,0.92)"); R(0,504,W,3,P.panelHi);
  for(var i=0;i<4;i++){
    var r=boostRect(i), b=BOOST[i], rdy=G.cd[b.id]<=0, on=(G.armed===b.id);
    R(r.x-2,r.y-2,r.w+4,r.h+4,on?P.goldHi:P.ink);
    R(r.x,r.y,r.w,r.h,rdy?b.col:"#3a3244");
    R(r.x,r.y,r.w,4,rdy?b.hi:"#4a4256"); R(r.x,r.y+r.h-4,r.w,4,rdy?b.lo:"#2a2434");
    R(r.x+6,r.y+12,12,24,rdy?b.lo:"#2a2434"); R(r.x+9,r.y+7,6,6,rdy?b.lo:"#2a2434");
    R(r.x+8,r.y+16,4,10,"#ffffff33");
    T(b.label,r.x+r.w/2+8,r.y+21,13,rdy?"#241408":"#7a7288","center","800");
    T("+"+Math.round(b.bonus*100)+"%",r.x+r.w/2+8,r.y+34,11,rdy?"#3a2410":"#6a6278","center","700");
    if(!rdy){ var f=1-G.cd[b.id]/(b.cd*G.ch.cdMul);
      R(r.x,r.y+r.h-7,r.w,4,"#1a1428"); R(r.x,r.y+r.h-7,r.w*f,4,P.amber); } } }
function drawTray(){
  R(0,TRAY.y,W,TRAY.h,"rgba(16,11,26,0.94)"); R(0,TRAY.y,W,3,P.ember);
  T("MEAT TRAY",10,TRAY.y+12,9,P.lilac,"left","800");
  T("tap meat, then tap the grid",W-10,TRAY.y+12,9,P.mute,"right","500");
  for(var i=0;i<4;i++){
    var r=cardRect(i),m=MEATS[i],on=(G.selMeat===i);
    R(r.x-1,r.y-1,r.w+2,r.h+2,on?P.gold:P.ink);
    R(r.x,r.y,r.w,r.h,on?"#3f3160":P.panel);
    R(r.x,r.y,r.w,4,on?P.goldHi:P.panelLo);
    meatSprite(m,r.x+r.w/2,r.y+25,m.done,m.doneHi,m.char,0.68,null);
    T(m.name,r.x+r.w/2,r.y+45,13,on?P.goldHi:P.cream,"center","800");
    T(m.label,r.x+r.w/2,r.y+55,9,P.lilac,"center","500"); } }
function drawMeat(i){
  var m=G.slots[i]; if(!m) return;
  var x=SLOT_X[i],y=SLOT_Y,def=m.def,win=windowFor(m),base,hi;
  if(m.dead){ base="#241c18"; hi="#3a2c22"; }
  else if(m.p<0.40){ base=def.raw; hi=def.rawHi; }
  else if(m.p<win[0]){ base="#c98a62"; hi="#e0a97e"; }
  else if(m.p<=win[1]){ base=def.done; hi=def.doneHi; }
  else if(m.p<1.06){ base="#5e3018"; hi="#7d4522"; }
  else { base="#241c18"; hi="#3a2c22"; }
  var lift=0,sq=1;
  if(m.flip>0){ var f=1-m.flip/0.44; lift=-Math.sin(f*Math.PI)*22; sq=Math.max(0.14,Math.abs(Math.cos(f*Math.PI))); }
  if(m.drop>0) lift-=m.drop*40;
  shadow(x,y+def.h/2+2,def.w*0.42,3,0.3);
  meatSprite(def,x,y+lift,base,hi,def.char,sq,m.sp);
  if(m.flip>0){ ctx.globalAlpha=0.45; R(x-16*sq,y+lift-9,32*sq,3,"#ffffff"); ctx.globalAlpha=1; }
  /* ---- flip meter: everything on one 0..1.25 scale ---- */
  var bw=52,by=y-def.h/2-18,bx=x-bw/2,SC=1/1.25;
  var warnAt=win[0]+(win[1]-win[0])*0.62;           /* last stretch of the green */
  var inGreen=m.p>=win[0]&&m.p<=win[1];
  var warning=m.p>=warnAt&&m.p<=win[1];
  var locked=m.p>win[1]&&!m.dead;
  var edge=warning?((Math.sin(gt*22)>0)?"#ff3a2a":"#ffd216"):(locked?"#ff3a2a":P.ink);
  R(bx-2,by-2,bw+4,10,edge);
  R(bx,by,bw,6,"#1a1428");
  /* green flip window, with its closing stretch in amber */
  R(bx+bw*win[0]*SC,by,bw*(warnAt-win[0])*SC,6,P.green);
  R(bx+bw*win[0]*SC,by,bw*(warnAt-win[0])*SC,2,P.greenHi);
  R(bx+bw*warnAt*SC,by,bw*(win[1]-warnAt)*SC,6,"#f2a01e");
  R(bx+bw*warnAt*SC,by,bw*(win[1]-warnAt)*SC,2,"#ffd27a");
  /* burn zone after the window closes */
  R(bx+bw*win[1]*SC,by,bw*(1.25-win[1])*SC,6,locked?"#c42a1a":"#5a1a14");
  /* marker */
  R(bx+bw*Math.min(1.25,m.p)*SC-1,by-3,3,12,P.goldHi);
  if(m.side===1) R(bx+bw+5,by,5,6,P.emberHi);
  if(warning){
    var fast=0.5+Math.sin(gt*16)*0.5;
    uctx.globalAlpha=0.6+fast*0.4;
    T("LAST CHANCE!",x,by-8,16,"#ffb21e","center","800",5,"#3a0800");
    uctx.globalAlpha=1;
  } else if(inGreen){
    var pl=0.5+Math.sin(gt*9)*0.5;
    uctx.globalAlpha=0.55+pl*0.45;
    T("FLIP!",x,by-8,20,P.goldHi,"center","800",5,"#2a1000");
    uctx.globalAlpha=1;
  } else if(locked&&Math.sin(gt*12)>0){
    T("BURNING!",x,by-8,15,P.redHi,"center","800",4,"#2a0800");
  } }
function drawThief(t){
  var d=t.def;
  if(t.dead) ctx.globalAlpha=Math.max(0,t.flee);
  if(d.ghost) ctx.globalAlpha=(t.dead?Math.max(0,t.flee):1)*0.74;
  shadow(t.x,t.y+d.h/2+4,d.w*0.42,4,d.ghost?0.08:0.24);
  thiefSprite(d,t.x,t.y,t.step,Math.sin(t.bob)*1.4,2);
  ctx.globalAlpha=1;
  if(!t.dead){
    if(t.wind>0&&Math.sin(gt*18)>0) T("!",t.x,t.y-d.h/2-10,26,P.redHi,"center","800",5,"#2a0800");
    if(t.hits>1) for(var i=0;i<t.hits;i++){ R(t.x-10+i*12,t.y+d.h/2+8,9,6,P.ink);
      R(t.x-9+i*12,t.y+d.h/2+9,7,4,P.red); } } }
function drawHUD(){
  R(0,0,W,HUD_H,"rgba(12,8,20,0.93)"); R(0,HUD_H-2,W,2,P.panelLo);
  T("SCORE "+G.score,8,20,15,P.gold,"left","800",3);
  T("COMBO x"+G.combo,8,37,12,G.combo>1?P.emberHi:P.mute,"left","800",3);
  var pi=phaseIdx(),into=(G.t%PHASE_LEN)/PHASE_LEN;
  R(130,8,100,8,P.ink); R(131,9,98,6,"#1a1428");
  R(131,9,98*((pi+into)/4),6,P.ember); R(131,9,98*((pi+into)/4),2,P.emberHi);
  T(G.tut?"Tutorial":phaseNow().name,180,27,11,G.tut?P.greenHi:P.cream,"center","700");
  T("served "+G.served+"   queue "+G.queue.length,180,41,10,P.lilac,"center","600");
  for(var i=0;i<5;i++){ R(W-19-i*13,37,12,12,P.ink);
    R(W-18-i*13,38,10,10,i<G.lives?P.red:"#332a4a");
    if(i<G.lives) R(W-18-i*13,38,10,3,P.redHi); }
  drawPauseBtn(); drawMute(); }

/* the scene's text lives on the high-res layer above the art, so any
   screen that dims the scene must wipe that layer or words bleed through */
function clearTextLayer(){ uctx.clearRect(0,0,W,H); }

/* ================= mode picker ================= */
function modeCard(r,title,lines,col,hi,lo,icon){
  R(r.x-3,r.y-3,r.w+6,r.h+6,P.ink);
  R(r.x,r.y,r.w,r.h,col); R(r.x,r.y,r.w,5,hi); R(r.x,r.y+r.h-5,r.w,5,lo);
  R(r.x+14,r.y+20,56,56,"rgba(0,0,0,0.22)");
  T(icon,r.x+42,r.y+60,32,"#ffffff","center","800");
  T(title,r.x+86,r.y+38,21,"#ffffff","left","800",4,"rgba(0,0,0,0.45)");
  for(var i=0;i<lines.length;i++) T(lines[i],r.x+86,r.y+60+i*16,12,"#fff6e0","left","600");
}
function drawMode(){
  menuBack();
  R(0,0,W,120,"#1a1230"); R(0,118,W,3,P.ember);
  drawLogo(W/2,56,false);
  T("How do you want to braai?",W/2,176,17,P.cream,"center","800",3);
  T("Playing as "+CHARS[sel].name,W/2,200,12,P.lilac,"center","600");
  modeCard(BTN_TUT,"TUTORIAL",["Slow and simple. Learn","every move step by step."],
           P.green,P.greenHi,P.greenLo,"?");
  modeCard(BTN_PLAYNOW,"PLAY NOW",["Straight into the braai.","Morning to night."],
           P.ember,P.emberHi,P.emberLo,"\u25B6");
  T("You can replay the tutorial any time from here.",W/2,486,11,P.mute,"center","500");
  drawArrow(); drawMute();
}

/* ================= tutorial dialog ================= */
function wrapText(str,size,maxW){
  var words=str.split(" "),lines=[],line="";
  for(var i=0;i<words.length;i++){
    var test=line?line+" "+words[i]:words[i];
    if(measure(test,size,"500")>maxW&&line){ lines.push(line); line=words[i]; }
    else line=test;
  }
  if(line) lines.push(line);
  return lines;
}
function hlRect(k){
  if(k==="tray") return {x:4,y:TRAY.y+4,w:W-8,h:TRAY.h-8};
  if(k==="grid") return {x:GRATE.x-6,y:GRATE.y-40,w:GRATE.w+12,h:96};
  if(k==="boost") return {x:4,y:508,w:W-8,h:52};
  if(k==="queue") return {x:20,y:196,w:W-40,h:108};
  return null;
}
function drawHighlight(k){
  var r=hlRect(k); if(!r) return;
  var a=0.55+Math.sin(gt*6)*0.45;
  ctx.globalAlpha=a; ctx.strokeStyle="#ffd216"; ctx.lineWidth=3;
  ctx.strokeRect(r.x,r.y,r.w,r.h); ctx.globalAlpha=1;
}
function drawTutorial(){
  var st=TUT[G.tutStep]; if(!st) return;
  if(!G.tutDialog){
    /* small reminder banner while the player does the task */
    if(st.hint){
      drawHighlight(st.hl);
      R(10,54,W-20,28,"rgba(12,8,20,0.9)"); R(10,54,4,28,P.green);
      T(st.hint,W/2,73,13,P.greenHi,"center","700");
    }
    return;
  }
  clearTextLayer();
  ctx.fillStyle="rgba(8,6,16,0.55)"; ctx.fillRect(0,0,W,H);
  drawHighlight(st.hl);
  var lines=wrapText(st.text,13,214);
  var bh=Math.max(118,64+lines.length*18+30), bw=W-28, bx=14;
  var by=(st.hl==="queue")?318:(st.hl===null?(H-bh)/2-20:62);
  R(bx-3,by-3,bw+6,bh+6,P.ink);
  R(bx,by,bw,bh,"#241a3a"); R(bx,by,bw,5,P.green); R(bx,by+bh-5,bw,5,"#160f26");
  /* host portrait: your chosen buddy */
  R(bx+12,by+20,60,76,"#1a1230");
  sprite(HUMAN,G.ch.pal,bx+26,by+30,2);
  T(G.ch.name,bx+42,by+112,11,P.goldHi,"center","800");
  T(st.title,bx+86,by+32,16,P.goldHi,"left","800",3);
  for(var i=0;i<lines.length;i++) T(lines[i],bx+86,by+56+i*18,13,P.cream,"left","500");
  var pulse=0.5+Math.sin(gt*5)*0.5;
  uctx.globalAlpha=0.5+pulse*0.5;
  T(st.wait?"Tap to try it  \u25B6":"Tap to continue  \u25B6",bx+bw-14,by+bh-14,12,P.greenHi,"right","800");
  uctx.globalAlpha=1;
  T("Step "+(G.tutStep+1)+" of "+TUT.length,bx+86,by+bh-14,10,P.mute,"left","600");
}
function drawTutEnd(){
  drawScene(); clearTextLayer();
  ctx.fillStyle="rgba(10,7,18,0.88)"; ctx.fillRect(0,0,W,H);
  drawLogo(W/2,150,false);
  T("TUTORIAL COMPLETE!",W/2,250,26,P.greenHi,"center","800",5,"#0e2a16");
  T("You've got the basics. Time to braai for real.",W/2,280,13,P.cream,"center","600",3);
  btn(BTN_TE_PLAY,"PLAY NOW",P.ember,P.emberHi,P.emberLo,"#3a1c00",19);
  btn(BTN_TE_REPLAY,"REPLAY TUTORIAL",P.green,P.greenHi,P.greenLo,"#0e2a16",14);
  btn(BTN_TE_MENU,"BACK TO MENU",P.panelHi,"#52407a",P.panelLo,P.goldHi,14);
  drawMute();
}

function drawPaused(){
  drawScene(); clearTextLayer();
  ctx.fillStyle="rgba(12,8,20,0.86)"; ctx.fillRect(0,0,W,H);
  T("PAUSED",W/2,220,38,P.goldHi,"center","800",6,"#2a1000");
  T("Score "+G.score+"   .   "+G.served+" plates served",W/2,254,14,P.cream,"center","600",3);
  btn(BTN_RESUME,"RESUME",P.ember,P.emberHi,P.emberLo,"#3a1c00",19);
  btn(BTN_QUIT,"QUIT TO MENU",P.panelHi,"#52407a",P.panelLo,P.goldHi,15);
  drawMute(); }
function drawOver(){
  drawScene(); clearTextLayer();
  ctx.fillStyle="rgba(12,8,20,0.9)"; ctx.fillRect(0,0,W,H);
  T("BRAAI'S OFF",W/2,180,34,P.redHi,"center","800",6,"#2a0800");
  T("You made it to "+phaseNow().name,W/2,212,14,P.cream,"center","600",3);
  T("FINAL SCORE",W/2,268,13,P.lilac,"center","700",3);
  T(String(G.score),W/2,318,46,P.goldHi,"center","800",6,"#3a2400");
  T(G.served+" plates served   .   "+G.walkedOff+" walked off",W/2,348,12,P.cream,"center","600",3);
  T("as "+G.ch.name,W/2,370,13,P.lilac,"center","600",3);
  btn(BTN_SAVE,G.saved?"SAVED":"SAVE SCORE",G.saved?P.panelHi:P.green,
      G.saved?"#52407a":P.greenHi,G.saved?P.panelLo:P.greenLo,G.saved?P.mute:"#0e2a16",14);
  btn(BTN_CARD,"SHARE CARD",P.panelHi,"#52407a",P.panelLo,P.goldHi,14);
  btn(BTN_AGAIN,"BRAAI AGAIN",P.ember,P.emberHi,P.emberLo,"#3a1c00",18);
  btn(BTN_MENU,"MENU",P.panelLo,P.panelHi,"#120c20",P.cream,13);
  drawMute(); }

function frame(now){
  var dt=Math.min(0.05,(now-tPrev)/1000); tPrev=now;
  update(dt);
  ctx.clearRect(0,0,W,H); uctx.clearRect(0,0,W,H);
  if(state==="title") drawTitle();
  else if(state==="card") drawCard();
  else if(state==="select") drawSelect();
  else if(state==="howto") drawHowTo();
  else if(state==="enemies") drawEnemies();
  else if(state==="scores") drawScores();
  else if(state==="play"){ drawScene(); if(G.tut) drawTutorial(); }
  else if(state==="mode") drawMode();
  else if(state==="tutend") drawTutEnd();
  else if(state==="paused") drawPaused();
  else drawOver();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
